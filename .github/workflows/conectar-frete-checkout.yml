              volume?: { weight?: number; height?: number; width?: number; length?: number }
            }

            return (
              <section className="mb-5 rounded-2xl border border-[#DED4C5] bg-white p-4">
                <h2 className="text-sm font-medium">Entrega escolhida no checkout</h2>
