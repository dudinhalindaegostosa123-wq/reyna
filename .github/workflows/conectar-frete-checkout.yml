                      <div className="mt-5 flex justify-between gap-3 border-t border-[#E5DED3] pt-5"><span>{delivery?.manual ? 'Subtotal sem frete' : 'Total'}</span><strong>{quote ? formatPrice(totalCents / 100) : 'A conferir'}</strong></div>
