          ''',

          'src/lib/shipping-server.ts': r'''import 'server-only'

          import { randomUUID } from 'node:crypto'
          import type { SupabaseClient } from '@supabase/supabase-js'
          import type { CheckoutLine, CheckoutQuote } from '@/lib/checkout'
          import type { ShippingSettings, DeliveryOption } from '@/lib/shipping'
          import { checkoutHash } from '@/lib/checkout-server'
          import { melhorEnvio, readQuotes } from '@/lib/melhor-envio'

          export async function shippingSettings(db: SupabaseClient): Promise<ShippingSettings> {
            const { data, error } = await db.from('serenity_shipping_settings')
              .select('*').eq('singleton', true).single()
            if (error) throw new Error('SHIPPING_CONFIGURATION')
            return data as ShippingSettings
          }

          export async function deliveryOptions(
            db: SupabaseClient,
            items: CheckoutLine[],
            request: string,
            cep: string,
            quote: CheckoutQuote
          ) {
            const settings = await shippingSettings(db)
            const manual = !settings.enabled ||
              settings.max_units === null ||
              items.reduce((n, i) => n + i.quantity, 0) > settings.max_units ||
              items.some(i => settings.manual_slugs.includes(i.slug))

            const volume = {
              weight: settings.weight_g / 1000,
              height: Number(settings.height),
              width: Number(settings.width),
              length: Number(settings.length),
              insurance: quote.total_cents / 100,
            }

            let options: DeliveryOption[], raw: unknown[] = []
            const providers = new Map<string, unknown>()

            if (manual) {
              options = [{
                id: randomUUID(),
                company: 'Serenity',
                service: 'Frete a confirmar com a equipe',
                amount_cents: 0,
                days: null,
                manual: true,
              }]
            } else {
              raw = await melhorEnvio('calculate', settings.contact_email || '', {
                from: { postal_code: settings.origin },
                to: { postal_code: cep },
                volumes: [volume],
                options: { receipt: false, own_hand: false },
              })

              options = readQuotes(raw)
                .filter(q => q.price <= 1000000)
                .slice(0, 50)
                .map(q => {
                  const id = randomUUID()
                  providers.set(id, raw.find(row =>
                    row && typeof row === 'object' && 'id' in row &&
                    String((row as { id: unknown }).id) === q.id
                  ) || null)

                  return {
                    id,
                    company: q.company,
                    service: q.service,
                    amount_cents: Math.round(q.price * 100),
                    days: q.days,
                    manual: false,
                  }
                })
            }

            if (!options.length) {
              return {
                options: [],
                message: 'Nenhuma transportadora retornou um serviço para esse CEP e pacote. Confira o CEP ou fale com o atendimento.',
              }
            }

            const expires = new Date(Date.now() + 15 * 60 * 1000).toISOString()
            const rows = options.map(option => ({
              id: option.id,
              request_id: request,
              cart_hash: checkoutHash(JSON.stringify(items)),
              destination: cep,
              subtotal_cents: quote.total_cents,
              amount_cents: option.amount_cents,
              manual: option.manual,
              settings_version: settings.version,
              expires_at: expires,
              snapshot: {
                company: option.company,
                service: option.service,
                days: option.days,
                origin: settings.origin,
                destination: cep,
                volume,
                provider: providers.get(option.id) || null,
              },
            }))

            await db.from('serenity_shipping_quotes').delete()
              .lt('expires_at', new Date(Date.now() - 48 * 60 * 60 * 1000).toISOString())

            const { error } = await db.from('serenity_shipping_quotes').insert(rows)
            if (error) throw new Error('SHIPPING_QUOTE_SAVE')

            return {
              options,
              message: manual
                ? 'Este pedido precisa de confirmação do frete pela equipe. O valor da entrega será informado antes do pagamento.'
                : 'Escolha uma entrega. A cotação vale por 15 minutos; o prazo de transporte começa após a postagem.',
            }
          }

          export function deliveryError(error: unknown) {
            const message = error && typeof error === 'object' && 'message' in error
              ? String(error.message)
              : ''

            if (message.includes('SHIPPING_QUOTE_EXPIRED')) {
              return 'A cotação expirou ou os dados mudaram. Calcule o frete novamente.'
            }
            if (message.includes('SHIPPING_CONFIGURATION')) {
              return 'As configurações de envio ainda não estão disponíveis. Fale com o atendimento.'
            }
            return ''
          }
          ''',

          'src/lib/shipping.ts': r'''export interface ShippingSettings {
            origin: string
            weight_g: number
            height: number
            width: number
            length: number
            max_units: number | null
            enabled: boolean
            contact_email: string | null
            manual_slugs: string[]
            version: number
          }

          export interface DeliveryOption {
            id: string
            company: string
            service: string
            amount_cents: number
            days: number | null
            manual: boolean
          }

          export interface DeliveryReceipt {
            number: number
            total: number
            shipping: number
            shippingPending: boolean
            reservedUntil: string | null
          }

          export function shippingFields(data: FormData, contact: string) {
            function numeric(key: string, min: number, max: number, integer = false): number {
              const raw = String(data.get(key) || '').trim()
              if (!/^\d+(?:[.,]\d{1,2})?$/.test(raw)) {
                throw new Error('Confira o campo ' + key + '.')
              }

              const n = Number(raw.replace(',', '.'))
              if (!Number.isFinite(n) || n < min || n > max || (integer && !Number.isInteger(n))) {
                throw new Error('Confira o campo ' + key + '.')
              }
              return n
            }

            const origin = String(data.get('origin') || '').trim().replace('-', '')
            if (!/^\d{8}$/.test(origin)) throw new Error('Confira o CEP de origem.')

            const max_units = String(data.get('max_units') || '').trim()
              ? numeric('max_units', 1, 49950, true)
              : null
            const enabled = data.get('enabled') === 'on'

            if (enabled && max_units === null) {
              throw new Error('Confirme o limite de peças da embalagem antes de ativar o frete automático.')
            }

            const manual_slugs = Array.from(new Set(
              String(data.get('manual_slugs') || '').split(/[\s,]+/).filter(Boolean)
            ))

            if (
              manual_slugs.length > 200 ||
              manual_slugs.some(s => !/^[a-zA-Z0-9_-]{1,180}$/.test(s))
            ) {
              throw new Error('Confira os slugs que exigem frete manual.')
            }

            return {
              origin,
              weight_g: numeric('weight_g', 1, 1000000, true),
              height: numeric('height', 0.1, 1000),
              width: numeric('width', 0.1, 1000),
              length: numeric('length', 0.1, 1000),
              max_units,
              enabled,
              contact_email: contact,
              manual_slugs,
            }
          }
          ''',
          }

          marker = '// Serenity: frete no checkout v1'

          def read(name):
              p = root / name
              if not p.is_file():
                  raise SystemExit(
                      'Falta o arquivo ' + name +
                      '. Nenhum arquivo foi alterado.'
                  )
              return p.read_text(encoding='utf-8')

          read('src/lib/melhor-envio.ts')
          read('src/app/admin/frete/ShippingTest.tsx')

          actions = read('src/app/checkout/actions.ts')
          if 'serenity_stock_review' not in actions:
              raise SystemExit(
                  'Envie o checkout atual antes desta atualização. Nenhum arquivo foi alterado.'
              )

          name = 'src/app/admin/pedidos/[id]/page.tsx'
          source = read(name)

          if marker not in source:
              source, count = re.subn(
                  r'<OrderOrigin\b',
                  '<OrderShipping details={(order as typeof order & {shipping_details?:unknown}).shipping_details} /><OrderOrigin',
                  source,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      'Envie a tela atual do pedido para incluir o frete. Nenhum arquivo foi alterado.'
                  )

              source = (
                  "import OrderShipping from '@/components/admin/OrderShipping'\n" +
                  source + '\n' + marker + '\n'
              )
              files[name] = source

          for name, content in files.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          print('Configurações de envio, cotação no checkout e entrega no pedido instaladas.')
          PY

