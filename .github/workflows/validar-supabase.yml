name: Validar Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Testar tabelas e armazenamento
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse

          url = os.environ.get("SUPABASE_URL", "").strip().rstrip("/")
          chave = os.environ.get("SUPABASE_SECRET_KEY", "").strip()

          if not url or not chave:
              raise SystemExit("Falta cadastrar um dos Secrets no GitHub.")

          endereco = urlparse(url)
          if (
              endereco.scheme != "https"
              or not (endereco.hostname or "").endswith(".supabase.co")
              or endereco.path
              or endereco.query
              or endereco.fragment
              or endereco.username
          ):
              raise SystemExit(
                  "SUPABASE_URL deve conter somente a Project URL: "
                  "https://seu-projeto.supabase.co"
              )

          if not chave.startswith("sb_secret_"):
              raise SystemExit(
                  "SUPABASE_SECRET_KEY deve conter a Secret key "
                  "que começa com sb_secret_."
              )

          def consultar(caminho, contar=False):
              headers = {"apikey": chave, "Accept": "application/json"}
              if contar:
                  headers["Prefer"] = "count=exact"

              pedido = urllib.request.Request(url + caminho, headers=headers)

              try:
                  with urllib.request.urlopen(pedido, timeout=45) as resposta:
                      conteudo = json.loads(resposta.read())
                      intervalo = resposta.headers.get("Content-Range", "")
                      return conteudo, intervalo
              except urllib.error.HTTPError as erro:
                  detalhe = erro.read().decode("utf-8", errors="replace")
                  detalhe = detalhe.replace(chave, "[chave protegida]")
                  print("Resposta do Supabase:", detalhe[:600])
                  raise SystemExit(f"Falha de conexão: HTTP {erro.code}")
              except urllib.error.URLError:
                  raise SystemExit(
                      "Não consegui alcançar o Supabase. Confira a Project URL."
                  )

          resumo = ["# Conexão com Supabase", ""]

          for tabela in [
              "products",
              "product_variants",
              "product_media",
              "product_import_sources",
          ]:
              coluna = "woo_id" if tabela == "product_import_sources" else "id"
              _, intervalo = consultar(
                  f"/rest/v1/{tabela}?select={coluna}&limit=1",
                  contar=True,
              )
              total = intervalo.rsplit("/", 1)[-1] if "/" in intervalo else "?"
              resumo.append(f"- Tabela `{tabela}`: OK — {total} registros")
              print("Tabela acessível:", tabela)

          bucket, _ = consultar("/storage/v1/bucket/produtos")
          if bucket.get("id") != "produtos":
              raise SystemExit("Não encontrei o bucket produtos.")
          if bucket.get("public") is not True:
              raise SystemExit("O bucket produtos ainda está privado.")

          resumo.append("- Espaço de fotos `produtos`: OK, público")
          resumo.append("")
          resumo.append("Conexão validada. Nenhum produto foi alterado.")

          with open(
              os.environ["GITHUB_STEP_SUMMARY"], "w", encoding="utf-8"
          ) as arquivo:
              arquivo.write("\n".join(resumo))

          print("Conexão validada com sucesso.")
          PY
