name: Instalar preparacao de etiquetas

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instalar-preparacao-etiquetas
  cancel-in-progress: false

jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar remetente e rascunhos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          files = {
          'src/app/admin/frete/label-actions.ts': r''''use server'

          import { revalidatePath } from 'next/cache'
          import { adminDatabase } from '@/lib/admin-auth'
          import { saleUuid } from '@/lib/admin-sales'
          import { readLabelFields } from '@/lib/label-draft'
          import type { SenderData, LabelData } from '@/lib/label-draft'
          import { loadLabelSender, loadLabelPreparation } from '@/lib/label-draft-server'

          function version(data: FormData, key: string, minimum = 0) {
            const raw = String(data.get(key) || '')
            if (!/^\d{1,15}$/.test(raw) || Number(raw) < minimum) {
              throw new Error('Atualize a página antes de salvar.')
            }
            return Number(raw)
          }

          function errorMessage(error: unknown) {
            const message = error && typeof error === 'object' && 'message' in error
              ? String(error.message)
              : ''

            if (message.includes('LABEL_STALE')) {
              return 'O pedido, remetente ou rascunho mudou em outra tela. Atualize a página e confira antes de salvar.'
            }
            if (message.includes('LABEL_ORDER_STATUS')) {
              return 'Pedidos cancelados ou estornados não podem receber uma preparação de envio.'
            }
            return 'Não foi possível salvar os dados do envio. Tente novamente; se persistir, confira se o SQL desta etapa foi executado.'
          }

          export async function saveLabelSender(
            data: FormData
          ): Promise<{ error: string; sender?: SenderData }> {
            const { db, user } = await adminDatabase()
            let fields: ReturnType<typeof readLabelFields>, expected: number

            try {
              fields = readLabelFields(data, 'sender')
              expected = version(data, 'version', 1)
            } catch (error) {
              return { error: error instanceof Error ? error.message : 'Confira os campos.' }
            }

            try {
              const { error } = await db.rpc('serenity_label_save_sender', {
                p_fields: fields,
                p_version: expected,
                p_actor: user.id,
              })
              if (error) throw error

              const { data: config, error: configError } = await db
                .from('serenity_shipping_settings')
                .select('origin').eq('singleton', true).single()

              if (configError) throw configError

              const sender = await loadLabelSender(db, config.origin)
              revalidatePath('/admin/frete')
              revalidatePath('/admin/pedidos/[id]', 'page')

              return { error: '', sender }
            } catch (error) {
              return { error: errorMessage(error) }
            }
          }

          export async function saveLabelDraft(
            id: string,
            data: FormData
          ): Promise<{ error: string; draft?: LabelData }> {
            const { db, user } = await adminDatabase()
            if (!saleUuid(id)) return { error: 'Pedido inválido.' }

            let fields: ReturnType<typeof readLabelFields>
            let expected: number, senderVersion: number, orderVersion: string

            try {
              fields = readLabelFields(data, 'draft')
              expected = version(data, 'version')
              senderVersion = version(data, 'sender_version', 1)
              orderVersion = String(data.get('order_version') || '')

              if (orderVersion.length > 50 || !Number.isFinite(Date.parse(orderVersion))) {
                throw new Error('Atualize a página antes de salvar.')
              }
            } catch (error) {
              return { error: error instanceof Error ? error.message : 'Confira os dados.' }
            }

            try {
              const { error } = await db.rpc('serenity_label_save_draft', {
                p_order: id,
                p_fields: fields,
                p_version: expected,
                p_order_version: orderVersion,
                p_sender_version: senderVersion,
                p_actor: user.id,
              })
              if (error) throw error

              const { data: order, error: orderError } = await db
                .from('serenity_orders').select('*').eq('id', id).single()

              if (orderError) throw orderError

              const draft = await loadLabelPreparation(db, order)
              revalidatePath('/admin/pedidos/' + id)

              return { error: '', draft }
            } catch (error) {
              return { error: errorMessage(error) }
            }
          }
          ''',

          'src/app/admin/frete/page.tsx': r'''import { adminDatabase } from '@/lib/admin-auth'
          import { shippingSettings } from '@/lib/shipping-server'
          import { loadLabelSender } from '@/lib/label-draft-server'
          import LabelSenderForm from '@/components/admin/LabelSenderForm'
          import ShippingSettingsForm from './ShippingSettingsForm'
          import ShippingTest from './ShippingTest'

          export const dynamic = 'force-dynamic'
          export const metadata = { title: 'Frete | Administração Serenity' }

          export default async function ShippingPage() {
            const { db } = await adminDatabase()
            const settings = await shippingSettings(db)
            const sender = await loadLabelSender(db, settings.origin)

            return (
              <div className="mx-auto max-w-4xl px-5 py-8 sm:px-8">
                <h1 className="text-3xl font-medium">Frete</h1>
                <p className="mb-7 mt-3 text-sm text-[#756B5D]">
                  Configure a embalagem, o remetente e teste os serviços disponíveis.
                </p>
                <ShippingSettingsForm settings={settings} />
                <LabelSenderForm initial={sender} />
                <ShippingTest />
              </div>
            )
          }
          ''',

          'src/components/admin/LabelPartyFields.tsx': r''''use client'

          import { PARTY_FIELDS } from '@/lib/label-draft'
          import type { LabelFields } from '@/lib/label-draft'

          export default function LabelPartyFields({ fields }: { fields: LabelFields }) {
            return (
              <div className="grid gap-4 sm:grid-cols-2">
                {PARTY_FIELDS.map(([name, label, max]) => (
                  <label key={name} className="block text-xs">
                    {label}
                    <input
                      name={name}
                      defaultValue={fields[name] || ''}
                      maxLength={max}
                      autoComplete="off"
                      className="mt-2 min-h-[44px] w-full rounded-xl border border-[#DDD4C7] bg-white px-3 text-base sm:text-sm"
                    />
                  </label>
                ))}
              </div>
            )
          }
          ''',

          'src/components/admin/LabelPreparation.tsx': r''''use client'

          import { useState } from 'react'
          import type { LabelData } from '@/lib/label-draft'
          import LabelPartyFields from './LabelPartyFields'
          import { saveLabelDraft } from '@/app/admin/frete/label-actions'
          import { saleMoney } from '@/lib/admin-sales'

          export default function LabelPreparation({ initial }: { initial: LabelData }) {
            const [draft, setDraft] = useState(initial)
            const [busy, setBusy] = useState(false)
            const [message, setMessage] = useState('')

            return (
              <section className="mb-5 rounded-3xl border border-[#DED4C5] bg-white p-5 sm:p-7">
                <h2 className="text-lg font-medium">Preparar etiqueta</h2>
                <p className="mt-2 text-xs leading-relaxed text-[#756B5D]">
                  Confira os dados do envio e salve o rascunho.
                  Esta etapa não envia dados ao Melhor Envio nem compra uma etiqueta.
                </p>
                <p className="mt-4 text-sm">
                  Frete do pedido: <strong>{draft.company} · {draft.service}</strong>
                </p>
                <p className="mt-2 text-xs text-[#756B5D]">
                  O custo para contratar a etiqueta será conferido na próxima etapa.
                </p>

                <details className="mt-5 rounded-xl border border-[#E5DED3] p-4">
                  <summary className="cursor-pointer text-xs font-medium">Conteúdo do pedido</summary>
                  <ul className="mt-3 space-y-2 text-xs">
                    {draft.products.map((product, index) => (
                      <li key={index}>
                        {product.quantity} × {product.name} · {saleMoney(product.value)} por unidade
                      </li>
                    ))}
                  </ul>
                </details>

                <form
                  key={draft.version}
                  className="mt-6"
                  onSubmit={async event => {
                    event.preventDefault()
                    if (busy) return
                    const data = new FormData(event.currentTarget)
                    setBusy(true)
                    setMessage('')

                    try {
                      const result = await saveLabelDraft(draft.id, data)
                      if (result.error) setMessage(result.error)
                      else if (result.draft) {
                        setDraft(result.draft)
                        setMessage('Rascunho salvo. Confira abaixo os dados que ainda precisam de atenção.')
                      }
                    } catch {
                      setMessage('A conexão falhou. Atualize a página antes de tentar salvar novamente.')
                    } finally {
                      setBusy(false)
                    }
                  }}
                >
                  <input type="hidden" name="version" value={draft.version} />
                  <input type="hidden" name="order_version" value={draft.orderVersion} />
                  <input type="hidden" name="sender_version" value={draft.senderVersion} />

                  <fieldset
                    disabled={busy || draft.status === 'cancelled' || draft.status === 'refunded'}
                    className="space-y-6 disabled:opacity-60"
                  >
                    <div>
                      <h3 className="mb-4 text-sm font-medium">Destinatário</h3>
                      <LabelPartyFields fields={draft.fields} />
                    </div>

                    <div>
                      <h3 className="mb-4 text-sm font-medium">Pacote</h3>
                      <div className="grid gap-4 sm:grid-cols-2">
                        {[
                          ['height', 'Altura (cm)'],
                          ['width', 'Largura (cm)'],
                          ['length', 'Comprimento (cm)'],
                          ['weight_g', 'Peso total embalado (g)'],
                        ].map(([name, label]) => (
                          <label key={name} className="text-xs">
                            {label}
                            <input
                              name={name}
                              defaultValue={draft.fields[name] || ''}
                              inputMode="decimal"
                              maxLength={20}
                              className="mt-2 min-h-[44px] w-full rounded-xl border border-[#DDD4C7] px-3 text-base sm:text-sm"
                            />
                          </label>
                        ))}
                      </div>
                    </div>

                    <div>
                      <h3 className="mb-4 text-sm font-medium">Documentação do envio</h3>
                      <div className="grid gap-4 sm:grid-cols-2">
                        <label className="text-xs">
                          Situação
                          <select
                            name="document_mode"
                            defaultValue={draft.fields.document_mode}
                            className="mt-2 min-h-[44px] w-full rounded-xl border border-[#DDD4C7] bg-white px-3 text-sm"
                          >
                            <option value="pending">A confirmar com a loja</option>
                            <option value="invoice">Nota fiscal eletrônica (NF-e)</option>
                          </select>
                        </label>
                        <label className="text-xs">
                          Chave de acesso da NF-e, quando emitida
                          <input
                            name="invoice_key"
                            defaultValue={draft.fields.invoice_key}
                            maxLength={44}
                            inputMode="numeric"
                            className="mt-2 min-h-[44px] w-full rounded-xl border border-[#DDD4C7] px-3 text-sm"
                          />
                        </label>
                      </div>
                      <p className="mt-3 text-xs text-[#756B5D]">
                        Não sabe qual documento a loja utiliza? Deixe a confirmar.
                        O sistema não presume declaração de conteúdo nem emite nota fiscal.
                      </p>
                    </div>

                    <label className="block text-xs">
                      Observações internas do envio
                      <textarea name="notes" defaultValue={draft.fields.notes} rows={3} maxLength={2000} className="mt-2 w-full rounded-xl border border-[#DDD4C7] p-3 text-sm" />
                    </label>

                    <button disabled={busy} className="rounded-full bg-[#292621] px-6 py-3 text-xs text-white disabled:opacity-50">
                      {busy ? 'Salvando…' : 'Salvar rascunho e conferir'}
                    </button>
                  </fieldset>
                </form>

                <p role="status" className="mt-4 text-sm">{message}</p>

                <div className="mt-5 rounded-2xl bg-[#F8F4ED] p-4">
                  <h3 className="text-sm font-medium">Conferência dos dados salvos</h3>
                  {draft.issues.length ? (
                    <ul className="mt-3 list-disc space-y-2 pl-4 text-xs leading-relaxed text-[#756B5D]">
                      {draft.issues.map((issue, index) => <li key={index}>{issue}</li>)}
                    </ul>
                  ) : (
                    <p className="mt-3 text-xs text-[#52654B]">
                      Sem campos pendentes nesta conferência. Ainda não há etiqueta gerada ou comprada.
                    </p>
                  )}
                  <p className="mt-4 text-[11px] text-[#756B5D]">
                    Se editar os campos acima, salve novamente para atualizar esta conferência.
                  </p>
                </div>
              </section>
            )
          }
          ''',

          'src/components/admin/LabelSenderForm.tsx': r''''use client'

          import { useState } from 'react'
          import type { SenderData } from '@/lib/label-draft'
          import LabelPartyFields from './LabelPartyFields'
          import { saveLabelSender } from '@/app/admin/frete/label-actions'

          export default function LabelSenderForm({ initial }: { initial: SenderData }) {
            const [sender, setSender] = useState(initial)
            const [busy, setBusy] = useState(false)
            const [message, setMessage] = useState('')

            return (
              <section className="mb-7 rounded-2xl border border-[#E5DED3] bg-white p-5 sm:p-7">
                <h2 className="text-lg font-medium">Remetente das etiquetas</h2>
                <p className="mb-5 mt-2 text-xs leading-relaxed text-[#756B5D]">
                  Cadastre os dados reais da pessoa ou empresa que despacha os pedidos.
                  É possível salvar parcialmente; os campos pendentes aparecerão na preparação de cada envio.
                  O CEP deve ser o mesmo da origem configurada acima.
                </p>

                <form key={sender.version} onSubmit={async event => {
                  event.preventDefault()
                  if (busy) return
                  const form = new FormData(event.currentTarget)
                  setBusy(true)
