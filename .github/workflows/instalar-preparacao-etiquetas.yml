                  try {
                    const result = await saveLabelSender(form)
                    if (result.error) setMessage(result.error)
                    else if (result.sender) {
                      setSender(result.sender)
                      setMessage('Remetente salvo. Os próximos rascunhos usarão estes dados.')
                    }
                  } catch {
                    setMessage('A conexão falhou. Atualize a página antes de tentar novamente.')
                  } finally {
                    setBusy(false)
                  }
                }}>
                  <input type="hidden" name="version" value={sender.version} />
                  <fieldset disabled={busy}>
                    <LabelPartyFields fields={sender.fields} />
                    <button disabled={busy} className="mt-5 rounded-full bg-[#292621] px-6 py-3 text-xs text-white disabled:opacity-50">
                      {busy ? 'Salvando…' : 'Salvar remetente'}
                    </button>
                  </fieldset>
                </form>
                <p role="status" className="mt-3 text-sm">{message}</p>
              </section>
            )
          }
          ''',

          'src/lib/label-draft-server.ts': r'''import 'server-only'

          import type { SupabaseClient } from '@supabase/supabase-js'
          import type { LabelFields, LabelData, SenderData } from '@/lib/label-draft'
          import { partyIssues } from '@/lib/label-draft'

          type Row = Record<string, unknown>
          const row = (input: unknown): Row =>
            input && typeof input === 'object' && !Array.isArray(input)
              ? input as Row
              : {}

          function textFields(input: unknown): LabelFields {
            return Object.fromEntries(
              Object.entries(row(input)).filter(([, value]) => typeof value === 'string')
            ) as LabelFields
          }

          export async function loadLabelSender(
            db: SupabaseClient,
            origin: string
          ): Promise<SenderData> {
            const { data, error } = await db.from('serenity_label_sender')
              .select('fields,version').eq('singleton', true).single()

            if (error) throw new Error('LABEL_QUERY')

            const fields = textFields(data.fields)
            return {
              fields: { ...fields, cep: fields.cep ?? origin },
              version: Number(data.version),
            }
          }

          export async function loadLabelPreparation(
            db: SupabaseClient,
            input: unknown
          ): Promise<LabelData> {
            const order = row(input), id = String(order.id)

            const [senderResult, draftResult, configResult] = await Promise.all([
              db.from('serenity_label_sender').select('fields,version').eq('singleton', true).single(),
              db.from('serenity_label_drafts').select('*').eq('order_id', id).maybeSingle(),
              db.from('serenity_shipping_settings').select('origin').eq('singleton', true).single(),
            ])

            if (senderResult.error || draftResult.error || configResult.error) {
              throw new Error('LABEL_QUERY')
            }

            const sender = textFields(senderResult.data.fields)
            const draft = draftResult.data
            const customer = row(order.customer_snapshot)
            const address = row(order.delivery_address)
            const shipping = row(order.shipping_details)
            const volume = row(shipping.volume)
            const provider = row(shipping.provider)

            const defaults: LabelFields = {
              name: String(customer.name || ''),
              email: String(customer.email || ''),
              phone: String(customer.phone || ''),
              document: '',
              state_register: '',
              cep: String(address.cep || ''),
              street: String(address.street || ''),
              number: String(address.number || ''),
              complement: String(address.complement || ''),
              district: String(address.district || ''),
              city: String(address.city || ''),
              state: String(address.state || ''),
              height: volume.height == null ? '' : String(volume.height),
              width: volume.width == null ? '' : String(volume.width),
              length: volume.length == null ? '' : String(volume.length),
              weight_g: volume.weight == null ? '' : String(Math.round(Number(volume.weight) * 1000)),
              document_mode: 'pending',
              invoice_key: '',
              notes: '',
            }

            const fields = { ...defaults, ...textFields(draft?.fields) }
            const issues = [
              ...partyIssues(sender, 'Remetente'),
              ...partyIssues(fields, 'Destinatário'),
            ]

            if ((sender.cep || '').replace(/\D/g, '') !== configResult.data.origin) {
              issues.push('O CEP do remetente deve coincidir com a origem configurada na aba Frete.')
            }
            if (order.status !== 'paid') {
              issues.push('O pedido precisa estar pago antes da compra da etiqueta.')
            }
            if (order.shipping_pending || shipping.manual || !provider.id) {
              issues.push('O frete deste pedido ainda precisa ser confirmado com uma transportadora e um serviço.')
            }
            if (shipping.destination && (fields.cep || '').replace(/\D/g, '') !== String(shipping.destination)) {
              issues.push('O CEP do destinatário está diferente do cotado. Será necessário conferir o frete para o novo destino.')
            }

            const metrics = ['height', 'width', 'length', 'weight_g']
            if (metrics.some(key =>
              !/^\d+(?:[.,]\d{1,2})?$/.test(fields[key]) ||
              Number(fields[key].replace(',', '.')) <= 0
            )) {
              issues.push('Preencha altura, largura, comprimento e peso positivos para o pacote.')
            } else if (
              Number(fields.weight_g.replace(',', '.')) > 1000000 ||
              metrics.slice(0, 3).some(key => Number(fields[key].replace(',', '.')) > 1000)
            ) {
              issues.push('Confira as dimensões e o peso do pacote.')
            } else if (volume.height != null && (
              Number(fields.height.replace(',', '.')) !== Number(volume.height) ||
              Number(fields.width.replace(',', '.')) !== Number(volume.width) ||
              Number(fields.length.replace(',', '.')) !== Number(volume.length) ||
              Number(fields.weight_g.replace(',', '.')) !== Math.round(Number(volume.weight) * 1000)
            )) {
              issues.push('O pacote foi alterado em relação à cotação. Será necessário conferir o frete antes de contratar a etiqueta.')
            }

            if (fields.document_mode !== 'invoice') {
              issues.push('Documentação do envio ainda não confirmada. Não foi presumida uma declaração de conteúdo.')
            } else {
              if (!/^\d{44}$/.test(fields.invoice_key)) {
                issues.push('Informe a chave de acesso da NF-e com 44 números.')
              }
              if (!sender.state_register) {
                issues.push('Confira e preencha a inscrição estadual / situação do remetente para o envio com NF-e.')
              }
            }

            if (draft && (
              String(draft.order_version) !== String(order.updated_at) ||
              Number(draft.sender_version) !== Number(senderResult.data.version)
            )) {
              issues.push('O pedido ou remetente mudou após este rascunho. Confira os dados e salve novamente.')
            }
            if (order.status === 'cancelled' || order.status === 'refunded') {
              issues.push('Este pedido não está disponível para preparação de envio.')
            }

            const products = (Array.isArray(order.items) ? order.items : []).map(item => {
              const p = row(item)
              return {
                name: [p.name, p.variation].filter(Boolean).join(' · '),
                quantity: Number(p.quantity),
                value: Number(p.unit_price),
              }
            })

            return {
              id,
              version: Number(draft?.version || 0),
              orderVersion: String(order.updated_at),
              senderVersion: Number(senderResult.data.version),
              fields,
              issues,
              company: String(shipping.company || 'A confirmar'),
              service: String(shipping.service || 'A confirmar'),
              status: String(order.status),
              products,
            }
          }
          ''',

          'src/lib/label-draft.ts': r'''import { CHECKOUT_STATES } from '@/lib/checkout'

          export type LabelFields = Record<string, string>

          export const PARTY_FIELDS = [
            ['name', 'Nome / razão social', 180],
            ['email', 'E-mail', 254],
            ['phone', 'Telefone com DDD', 25],
            ['document', 'CPF ou CNPJ', 30],
            ['state_register', 'Inscrição estadual / ISENTO', 30],
            ['cep', 'CEP', 10],
            ['street', 'Rua ou avenida', 180],
            ['number', 'Número', 30],
            ['complement', 'Complemento', 180],
            ['district', 'Bairro', 100],
            ['city', 'Cidade', 100],
            ['state', 'Estado (UF)', 2],
          ] as const

          export interface SenderData {
            fields: LabelFields
            version: number
          }

          export interface LabelData {
            id: string
            version: number
            orderVersion: string
            senderVersion: number
            fields: LabelFields
            issues: string[]
            company: string
            service: string
            status: string
            products: { name: string; quantity: number; value: number }[]
          }

          export function readLabelFields(
            data: FormData,
            kind: 'sender' | 'draft'
          ): LabelFields {
            const allowed: readonly (readonly [string, string, number])[] =
              kind === 'sender' ? PARTY_FIELDS : [
                ...PARTY_FIELDS,
                ['height', 'Altura', 20],
                ['width', 'Largura', 20],
                ['length', 'Comprimento', 20],
                ['weight_g', 'Peso', 20],
                ['document_mode', 'Documentação', 30],
                ['invoice_key', 'Chave da NF-e', 44],
                ['notes', 'Observações', 2000],
              ]

            const result: LabelFields = {}

            for (const [key, label, max] of allowed) {
              const value = data.get(key)
              if (value !== null && typeof value !== 'string') {
                throw new Error('Confira o campo ' + label + '.')
              }

              const text = String(value || '').trim()
              if (text.length > max || /[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(text)) {
                throw new Error('Confira o campo ' + label + '.')
              }
              result[key] = text
            }

            if (kind === 'draft' && !['pending', 'invoice'].includes(result.document_mode)) {
              throw new Error('Confira a documentação do envio.')
            }

            return result
          }

          export function partyIssues(fields: LabelFields, who: string): string[] {
            const result: string[] = []
            const required = ['name', 'email', 'phone', 'document', 'cep', 'street', 'number', 'district', 'city', 'state']
            const missing = PARTY_FIELDS
              .filter(([key]) => required.includes(key) && !fields[key])
              .map(([, label]) => label)

            if (missing.length) result.push(`${who}: preencha ${missing.join(', ')}.`)
            if (fields.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fields.email)) {
              result.push(`${who}: confira o e-mail.`)
            }
            if (fields.phone && !/^\d{10,11}$/.test(fields.phone.replace(/\D/g, ''))) {
              result.push(`${who}: confira o telefone com DDD.`)
            }
            if (fields.cep && !/^\d{8}$/.test(fields.cep.replace(/\D/g, ''))) {
              result.push(`${who}: confira o CEP.`)
            }
            if (fields.state && !CHECKOUT_STATES.includes(fields.state.toUpperCase())) {
              result.push(`${who}: confira o estado.`)
            }

            const doc = (fields.document || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase()
            if (doc && !/^(\d{11}|[A-Z0-9]{12}\d{2})$/.test(doc)) {
              result.push(`${who}: confira o formato do CPF/CNPJ.`)
            }
            return result
          }
          ''',
          }

          marker = '// Serenity: preparacao de etiqueta v1'

          def read(name):
              path = root / name
              if not path.is_file():
                  raise SystemExit(
                      'Falta o arquivo ' + name +
                      '. Nenhum arquivo foi alterado.'
                  )
              return path.read_text(encoding='utf-8')

          read('src/lib/shipping-server.ts')
          read('src/app/admin/frete/ShippingSettingsForm.tsx')

          name = 'src/app/admin/pedidos/[id]/page.tsx'
          source = read(name)

          if marker not in source:
              source, count = re.subn(
                  r'(\bconst\s+margin\s*=)',
                  r'const labelPreparation = await loadLabelPreparation(db, order)\n  \1',
                  source,
                  count=1
              )
              if count != 1:
                  raise SystemExit(
                      'Envie a tela atual do pedido para incluir a preparação. Nenhum arquivo foi alterado.'
                  )

              source, count = re.subn(
                  r'<OrderOrigin\b',
                  '<LabelPreparation initial={labelPreparation} /><OrderOrigin',
                  source,
                  count=1
              )
              if count != 1:
                  raise SystemExit(
                      'Não encontrei o local de preparação do envio. Nenhum arquivo foi alterado.'
                  )

              source = (
                  "import LabelPreparation from '@/components/admin/LabelPreparation'\n"
                  "import { loadLabelPreparation } from '@/lib/label-draft-server'\n"
                  + source + '\n' + marker + '\n'
              )
              files[name] = source

          for name, content in files.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          print('Remetente e preparação local de etiqueta instalados.')
          print('Nenhum envio foi comprado ou enviado ao Melhor Envio.')
          PY

