name: Instalar teste do Melhor Envio

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instalar-teste-melhor-envio
  cancel-in-progress: false

jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar tela de teste
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          files = {
          'src/app/admin/frete/actions.ts': r''''use server'

          import { requireAdmin } from '@/lib/admin-auth'
          import { melhorEnvio, readQuotes, shippingMessage } from '@/lib/melhor-envio'
          import { testPackage } from '@/lib/shipping-test'
          import type { ShippingTestResult } from '@/lib/shipping-test'

          export async function testShipping(
            kind: 'connection' | 'quote',
            data: FormData
          ): Promise<ShippingTestResult> {
            const user = await requireAdmin()

            if (kind !== 'connection' && kind !== 'quote') {
              return { ok: false, message: 'Operação inválida.' }
            }

            try {
              if (kind === 'connection') {
                const rows = await melhorEnvio('companies', user.email || '')
                return {
                  ok: true,
                  message: `Conexão confirmada. ${rows.length} transportadoras retornadas pelo Melhor Envio.`,
                }
              }

              const payload = testPackage(data)
              const quotes = readQuotes(
                await melhorEnvio('calculate', user.email || '', payload)
              )

              return {
                ok: true,
                quotes,
                message: quotes.length
                  ? `${quotes.length} opções de frete disponíveis para esta simulação.`
                  : 'Nenhum serviço disponível para esses CEPs e essa embalagem. Confira os dados ou tente outro destino.',
              }
            } catch (error) {
              return { ok: false, message: shippingMessage(error) }
            }
          }
          ''',

          'src/app/admin/frete/page.tsx': r'''import { requireAdmin } from '@/lib/admin-auth'
          import ShippingTest from './ShippingTest'

          export const dynamic = 'force-dynamic'

          export const metadata = {
            title: 'Frete | Administração Serenity',
          }

          export default async function ShippingPage() {
            await requireAdmin()

            return (
              <div className="mx-auto max-w-4xl px-5 py-8 sm:px-8">
                <h1 className="text-3xl font-medium tracking-tight">Frete</h1>

                <p className="mb-7 mt-3 max-w-2xl text-sm leading-relaxed text-[#756B5D]">
                  Teste a conexão e a cotação com os dados da sua embalagem.
                  Esta simulação não compra etiquetas nem altera os pedidos.
                  O frete do checkout será conectado na próxima etapa.
                </p>

                <ShippingTest />
              </div>
            )
          }
          ''',

          'src/app/admin/frete/ShippingTest.tsx': r''''use client'

          import { useRef, useState } from 'react'
          import { testShipping } from './actions'
          import type { ShippingTestResult } from '@/lib/shipping-test'

          const fields = [
            ['origin', 'CEP de origem da loja', '00000-000', 'text'],
            ['destination', 'CEP de destino para teste', '00000-000', 'text'],
            ['weight', 'Peso total embalado (gramas)', 'Inclua a caixa e a proteção', 'numeric'],
            ['width', 'Largura da embalagem (cm)', 'Medida externa', 'decimal'],
            ['height', 'Altura da embalagem (cm)', 'Medida externa', 'decimal'],
            ['length', 'Comprimento da embalagem (cm)', 'Medida externa', 'decimal'],
            ['value', 'Valor declarado do conteúdo (R$)', 'Sem separador de milhar', 'decimal'],
          ] as const

          export default function ShippingTest() {
            const formRef = useRef<HTMLFormElement>(null)
            const [busy, setBusy] = useState(false)
            const [result, setResult] = useState<ShippingTestResult | null>(null)

            async function run(kind: 'connection' | 'quote') {
              if (busy || !formRef.current) return

              setBusy(true)
              setResult(null)

              try {
                setResult(
                  await testShipping(kind, new FormData(formRef.current))
                )
              } catch {
                setResult({
                  ok: false,
                  message: 'A consulta não terminou. Atualize a página e tente novamente.',
                })
              } finally {
                setBusy(false)
              }
            }

            return (
              <form
                ref={formRef}
                onSubmit={event => {
                  event.preventDefault()
                  void run('quote')
                }}
                className="space-y-6"
                aria-busy={busy}
              >
                <div className="rounded-2xl border border-[#E5DED3] bg-white p-5 sm:p-7">
                  <h2 className="text-lg font-medium">
                    Conexão com o Melhor Envio
                  </h2>

                  <p className="mt-2 text-xs leading-relaxed text-[#756B5D]">
                    Confira primeiro se a chave configurada permite consultar as transportadoras.
                  </p>

                  <button
                    type="button"
                    disabled={busy}
                    onClick={() => void run('connection')}
                    className="mt-4 rounded-full border border-[#CFC3B1] px-5 py-3 text-xs disabled:opacity-50"
                  >
                    Testar conexão
                  </button>
                </div>

                <div className="rounded-2xl border border-[#E5DED3] bg-white p-5 sm:p-7">
                  <h2 className="text-lg font-medium">Simular um envio</h2>

                  <p className="mt-2 text-xs leading-relaxed text-[#756B5D]">
                    Informe uma embalagem real, já com as joias e a proteção.
                    As medidas são externas.
                  </p>

                  <fieldset
                    disabled={busy}
                    className="mt-6 grid gap-4 sm:grid-cols-2"
                  >
                    <legend className="sr-only">
                      Dados da embalagem para cotação
                    </legend>

                    {fields.map(([name, label, placeholder, mode]) => (
                      <label key={name} className="block text-xs">
                        {label}
                        <input
                          name={name}
                          inputMode={mode}
                          placeholder={placeholder}
                          maxLength={30}
                          autoComplete="off"
                          className="mt-2 min-h-[44px] w-full rounded-xl border border-[#DDD4C7] bg-[#FCFBF8] px-3 text-base outline-none focus:border-[#947B57] sm:text-sm"
                        />
                      </label>
                    ))}
                  </fieldset>

                  <button
                    type="submit"
                    disabled={busy}
                    className="mt-6 rounded-full bg-[#292621] px-6 py-3 text-xs text-white disabled:opacity-50"
                  >
                    {busy ? 'Consultando…' : 'Calcular fretes de teste'}
                  </button>
                </div>

                <div role="status" aria-live="polite" className="text-sm">
                  {result && (
                    <p
                      className={`rounded-xl p-4 ${
                        result.ok
                          ? 'bg-[#EDF2EA] text-[#42563A]'
                          : 'bg-[#F8EDE8] text-[#8A4933]'
                      }`}
                    >
                      {result.message}
                    </p>
                  )}
                </div>

                {result?.ok && Boolean(result.quotes?.length) && (
                  <ul className="grid gap-3 sm:grid-cols-2">
                    {result.quotes?.map((quote, index) => (
                      <li
                        key={`${quote.id}-${index}`}
                        className="rounded-2xl border border-[#E5DED3] bg-white p-5"
                      >
                        <p className="text-xs text-[#756B5D]">
                          {quote.company}
                        </p>

                        <h3 className="mt-1 text-sm font-medium">
                          {quote.service}
                        </h3>

                        <p className="mt-4 text-xl font-medium">
                          {quote.price.toLocaleString('pt-BR', {
                            style: 'currency',
                            currency: 'BRL',
                          })}
                        </p>

                        <p className="mt-1 text-xs text-[#756B5D]">
                          {quote.days === null
                            ? 'Prazo a confirmar'
                            : `Prazo de transporte estimado: ${quote.days} dia(s)`}
                        </p>
                      </li>
                    ))}
                  </ul>
                )}
              </form>
            )
          }
          ''',

          'src/lib/melhor-envio.ts': r'''import 'server-only'
          import type { ShippingQuote } from '@/lib/shipping-test'

          type ObjectRow = Record<string, unknown>

          const object = (value: unknown): ObjectRow =>
            value !== null && typeof value === 'object' && !Array.isArray(value)
              ? value as ObjectRow
              : {}

          export async function melhorEnvio(
            path: 'companies' | 'calculate',
            contact: string,
            payload?: unknown
          ): Promise<unknown[]> {
            const token = process.env.MELHOR_ENVIO_TOKEN?.trim()

            if (!token) throw new Error('ME_CONFIGURATION')

            if (
              !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact) ||
              /[\r\n]/.test(contact)
            ) {
              throw new Error('ME_CONTACT')
            }

            const controller = new AbortController()
            const timer = setTimeout(() => controller.abort(), 18000)

            try {
              const response = await fetch(
                'https://www.melhorenvio.com.br/api/v2/me/shipment/' + path,
                {
                  method: path === 'calculate' ? 'POST' : 'GET',
                  headers: {
                    Authorization: 'Bearer ' + token.replace(/^Bearer\s+/i, ''),
                    Accept: 'application/json',
                    'Content-Type': 'application/json',
                    'User-Agent': `Serenity Site (${contact})`,
                  },
                  body: path === 'calculate'
                    ? JSON.stringify(payload)
                    : undefined,
                  cache: 'no-store',
                  redirect: 'error',
                  signal: controller.signal,
                }
              )

              if (response.status === 401) throw new Error('ME_TOKEN')
              if (response.status === 403) throw new Error('ME_PERMISSION')
              if (response.status === 422) throw new Error('ME_PACKAGE')
              if (response.status === 429) throw new Error('ME_LIMIT')
              if (!response.ok) throw new Error('ME_UNAVAILABLE')

              const result: unknown = await response.json()

              if (!Array.isArray(result)) throw new Error('ME_RESPONSE')

              return result
            } finally {
              clearTimeout(timer)
            }
          }

          export function readQuotes(rows: unknown[]): ShippingQuote[] {
            function amount(value: unknown): number | null {
              if (
                typeof value !== 'number' &&
                (
                  typeof value !== 'string' ||
                  !/^\d+(?:\.\d+)?$/.test(value)
                )
              ) {
                return null
              }

              const number = Number(value)

              return Number.isFinite(number) && number >= 0
                ? number
                : null
            }

            const result: ShippingQuote[] = []

            for (const value of rows) {
              const row = object(value)

              if (row.error) continue

              const price = amount(row.custom_price ?? row.price)

              if (
                price === null ||
                row.id === undefined ||
                typeof row.name !== 'string'
              ) {
                continue
              }

              const days = amount(
                row.custom_delivery_time ?? row.delivery_time
              )

              const company = object(row.company)

              result.push({
                id: String(row.id).slice(0, 80),
                service: row.name.slice(0, 120),
                company: typeof company.name === 'string'
                  ? company.name.slice(0, 120)
                  : 'Transportadora',
                price,
                days: days !== null && Number.isInteger(days)
                  ? days
                  : null,
              })
            }

            return result.sort((a, b) => a.price - b.price)
          }

          export function shippingMessage(error: unknown): string {
            const code = error instanceof Error ? error.message : ''

            const messages: Record<string, string> = {
              ME_CONFIGURATION: 'A variável MELHOR_ENVIO_TOKEN não está disponível neste ambiente. Salve na Vercel e faça um novo deploy.',
              ME_CONTACT: 'Confira o e-mail da sua conta de administrador para identificar a integração.',
              ME_TOKEN: 'O Melhor Envio recusou o token. Confira se foi copiado inteiro e se continua válido.',
              ME_PERMISSION: 'O token não tem a permissão necessária para esta consulta.',
              ME_PACKAGE: 'O Melhor Envio recusou os dados. Confira os CEPs, as medidas, o peso e o valor declarado.',
              ME_LIMIT: 'Limite de consultas atingido. Aguarde um pouco e tente novamente.',
              INPUT_CEP: 'Preencha os dois CEPs com oito números, com ou sem hífen.',
              INPUT_NUMBER: 'Confira os campos numéricos: peso em gramas inteiras; medidas com até duas casas; valor sem separador de milhar.',
            }

            return messages[code] ||
              'Não foi possível consultar o Melhor Envio agora. Tente novamente em alguns instantes.'
          }
          ''',

          'src/lib/shipping-test.ts': r'''export interface ShippingQuote {
            id: string
            company: string
            service: string
            price: number
            days: number | null
          }

          export type ShippingTestResult =
            | { ok: true; message: string; quotes?: ShippingQuote[] }
            | { ok: false; message: string }

          export function testPackage(data: FormData) {
            function cep(name: string) {
              const raw = String(data.get(name) || '').trim()

              if (!/^\d{5}-?\d{3}$/.test(raw)) {
                throw new Error('INPUT_CEP')
              }

              return raw.replace('-', '')
            }

            function number(
              name: string,
              min: number,
              max: number,
              decimals: number
            ) {
              const raw = String(data.get(name) || '').trim()

              if (
                !/^\d+(?:[.,]\d+)?$/.test(raw) ||
                (raw.split(/[.,]/)[1]?.length || 0) > decimals
              ) {
                throw new Error('INPUT_NUMBER')
              }

              const result = Number(raw.replace(',', '.'))

              if (
                !Number.isFinite(result) ||
                result < min ||
                result > max
              ) {
                throw new Error('INPUT_NUMBER')
              }

              return result
            }

            return {
              from: { postal_code: cep('origin') },
              to: { postal_code: cep('destination') },
              volumes: [{
                weight: number('weight', 1, 1000000, 0) / 1000,
                width: number('width', 0.1, 1000, 2),
                height: number('height', 0.1, 1000, 2),
                length: number('length', 0.1, 1000, 2),
                insurance: number('value', 0, 1000000, 2),
              }],
              options: { receipt: false, own_hand: false },
            }
          }
          ''',
          }

          for name, content in files.items():
              target = root / name
              if target.exists() and target.read_text(encoding='utf-8') != content:
                  raise SystemExit(
                      'Já existe uma versão diferente de ' + name +
                      '. Nenhum arquivo foi alterado.'
                  )

          nav = root / 'src/components/admin/AdminNavigation.tsx'
          navigation = None

          if nav.is_file():
              source = nav.read_text(encoding='utf-8')
              if '/admin/frete' not in source:
                  pattern = r"(\[\s*['\"]/admin/produtos['\"]\s*,\s*['\"]Produtos['\"]\s*\])"
                  changed, count = re.subn(
                      pattern,
                      r"\1,['/admin/frete','Frete']",
                      source
                  )
                  if count == 1:
                      navigation = changed

          for name, content in files.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          if navigation is not None:
              nav.write_text(navigation, encoding='utf-8')

          print('Tela de teste instalada em /admin/frete.')
          print('Nenhuma etiqueta foi comprada ou pedido alterado.')
          PY

      - run: npm ci --ignore-scripts

      - run: npx tsc --noEmit --incremental false

      - run: npx next lint --no-cache

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/app/admin/frete src/lib/melhor-envio.ts src/lib/shipping-test.ts

          if [ -f src/components/admin/AdminNavigation.tsx ]; then
            git add src/components/admin/AdminNavigation.tsx
          fi

          if git diff --cached --quiet; then
            echo "Tela de teste já instalada."
          else
            git commit -m "Adicionar teste autenticado de cotação do Melhor Envio"
            git push origin HEAD:main
          fi
