name: Instalar custo e carrinho de etiquetas

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custo-carrinho-etiquetas
  cancel-in-progress: false

jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar custo e preparação no Melhor Envio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          files = {
          'src/app/admin/frete/cart-actions.ts': r''''use server'
          import { revalidatePath } from 'next/cache'
          import { adminDatabase } from '@/lib/admin-auth'
          import { saleUuid } from '@/lib/admin-sales'
          import { quoteLabel,loadLabelJobView,labelPayload,labelCartRequest,remoteCart,remotePrice,verifyRemote,labelJobError } from '@/lib/label-cart-server'
          import type { LabelJobView } from '@/lib/label-cart'

          type Result={error:string;message?:string;view?:LabelJobView;remoteHint?:string}

          export async function labelJobAction(id:string,command:'quote'|'prepare'|'recover',data:FormData):Promise<Result>{
            const {db,user}=await adminDatabase()
            if(!saleUuid(id)||!['quote','prepare','recover'].includes(command))return {error:'Operação inválida.'}
            let remoteHint=''
            try{
              if(command==='quote'){
                const agency=String(data.get('agency')||'').trim(),cnae=String(data.get('cnae')||'').replace(/\D/g,'')
                if(agency&&!/^[1-9]\d{0,8}$/.test(agency))return {error:'Informe um ID de agência válido ou deixe vazio.'}
                if(cnae&&!/^\d{7}$/.test(cnae))return {error:'O CNAE deve ter sete números ou ficar vazio.'}
                await quoteLabel(db,id,user.id,user.email||'',{agency,cnae})
                revalidatePath('/admin/pedidos/'+id)
                return {error:'',message:'Custo consultado. Selecione o serviço para conferir a preparação.',view:await loadLabelJobView(db,id)}
              }

              const operation=String(data.get('operation')||'')
              if(!saleUuid(operation))return {error:'Confira o custo antes de preparar.'}

              const {data:job,error:jobError}=await db.from('serenity_label_jobs').select('*').eq('order_id',id).single()
              if(jobError)throw jobError
              if(job.operation!==operation)throw new Error('LABEL_STALE')

              if(command==='recover'){
                if(!['creating','uncertain'].includes(job.state))throw new Error('LABEL_JOB_LOCKED')
                const remoteId=String(data.get('remote_id')||'').trim()
                if(!saleUuid(remoteId))return {error:'Informe o ID completo do envio no Melhor Envio.'}

                const response=await labelCartRequest('GET',user.email||'',remoteId)
                verifyRemote(response,remoteId,operation)

                const {error}=await db.rpc('serenity_label_job_finish',{p_order:id,p_operation:operation,p_state:'prepared',p_remote:remoteId,p_price:remotePrice(response),p_actor:user.id})
                if(error)throw error

                revalidatePath('/admin/pedidos/'+id)
                return {error:'',message:'Envio existente localizado e vinculado ao pedido.',view:await loadLabelJobView(db,id)}
              }

              const view=await loadLabelJobView(db,id)
              if(view.issues.length)return {error:'Complete as pendências abaixo antes de preparar no Melhor Envio.',view}
              if(view.stale)throw new Error('LABEL_STALE')
              if(!process.env.MELHOR_ENVIO_TOKEN?.trim()||!user.email)throw new Error('LABEL_CONFIG')

              const selected=String(data.get('selected')||'')
              const choice=(job.quotes as unknown[]).find(q=>q&&typeof q==='object'&&'id' in q&&q.id===selected)
              if(!choice)return {error:'Selecione um serviço da cotação atual.'}

              const body=labelPayload(job.context,choice,operation)

              const {error:claimError}=await db.rpc('serenity_label_job_claim',{p_order:id,p_operation:operation,p_selected:selected,p_actor:user.id})
              if(claimError)throw claimError

              try{
                const response=await labelCartRequest('POST',user.email||'',undefined,body),created=remoteCart(response)
                if(!saleUuid(created.id))throw new Error('LABEL_REMOTE_UNKNOWN')
                remoteHint=created.id

                const {error}=await db.rpc('serenity_label_job_finish',{p_order:id,p_operation:operation,p_state:'prepared',p_remote:created.id,p_price:remotePrice(response),p_actor:user.id})
                if(error)throw error
              }catch(error){
                const definitive=error instanceof Error&&error.message==='LABEL_REMOTE_REJECTED'
                await db.rpc('serenity_label_job_finish',{p_order:id,p_operation:operation,p_state:definitive?'rejected':'uncertain',p_remote:null,p_price:null,p_actor:user.id})
                throw error
              }

              revalidatePath('/admin/pedidos/'+id)
              return {error:'',message:'Envio preparado no carrinho do Melhor Envio. Nenhuma compra foi feita pelo painel.',view:await loadLabelJobView(db,id)}
            }catch(error){
              revalidatePath('/admin/pedidos/'+id)
              let view:LabelJobView|undefined
              try{view=await loadLabelJobView(db,id)}catch{}
              return {error:labelJobError(error),view,...(remoteHint?{remoteHint}:{} )}
            }
          }
          ''',

          'src/components/admin/LabelOperations.tsx': r''''use client'
          import { useEffect,useRef,useState } from 'react'
          import { labelJobAction } from '@/app/admin/frete/cart-actions'
          import type { LabelJobView } from '@/lib/label-cart'
          import { saleMoney } from '@/lib/admin-sales'

          export default function LabelOperations({initial}:{initial:LabelJobView}){
            const [view,setView]=useState(initial),[busy,setBusy]=useState(false),[message,setMessage]=useState(''),[selected,setSelected]=useState(''),[remoteId,setRemoteId]=useState('')
            const [dirty,setDirty]=useState(false),formRef=useRef<HTMLFormElement>(null)

            useEffect(()=>{setView(initial)},[initial])

            const locked=['creating','prepared','uncertain'].includes(view.state)
            const option=view.choices.find(q=>q.id===selected)

            async function run(command:'quote'|'prepare'|'recover'){
              if(busy||!formRef.current)return
              const data=new FormData(formRef.current)
              data.set('operation',view.operation)
              data.set('selected',selected)
              data.set('remote_id',remoteId)
              setBusy(true)
              setMessage('')

              try{
                const result=await labelJobAction(view.orderId,command,data)
                if(result.view)setView(result.view)
                setMessage(result.error||result.message||'')
                if(result.remoteHint)setRemoteId(result.remoteHint)
                if(!result.error&&command==='quote'){
                  setSelected('')
                  setDirty(false)
                }
              }catch{
                setMessage('A conexão falhou. Atualize a página para conferir o estado antes de tentar preparar novamente.')
              }finally{
                setBusy(false)
              }
            }

            const states:Record<string,string>={
              empty:'Ainda não consultado',
              quoted:'Custo consultado',
              creating:'Preparação iniciada — aguardando confirmação',
              prepared:'Preparado no carrinho do Melhor Envio',
              rejected:'Preparação recusada pelo Melhor Envio',
              uncertain:'Resultado ainda não confirmado'
            }

            return (
              <section className="mb-5 rounded-3xl border border-[#DED4C5] bg-[#F8F4ED] p-5 sm:p-7">
                <h2 className="text-lg font-medium">Custo e preparo no Melhor Envio</h2>

                <p className="mt-2 text-xs leading-relaxed text-[#756B5D]">
                  Consulte o custo usando os dados salvos no rascunho. A preparação coloca o envio no carrinho do Melhor Envio; este painel ainda não compra nem imprime a etiqueta.
                </p>

                <p role="status" className="mt-4 text-sm font-medium">
                  {states[view.state]||view.state}
                </p>

                <p className="mt-2 text-xs">
                  Frete cobrado do cliente: {saleMoney(view.charged)}
                </p>

                {view.remoteId&&(
                  <div className="mt-4 rounded-xl bg-white p-4">
                    <p className="break-all text-xs">ID do envio: {view.remoteId}</p>
                    <p className="mt-2 text-sm">
                      Valor retornado pelo carrinho: {view.remotePrice===null?'A confirmar no Melhor Envio':saleMoney(view.remotePrice)}
                    </p>
                    <p className="mt-2 text-xs text-[#756B5D]">
                      O envio está vinculado. A compra e a emissão da etiqueta serão a próxima etapa.
                    </p>
                    <a href="https://melhorenvio.com.br" target="_blank" rel="noopener noreferrer" className="mt-3 inline-block text-xs underline">
                      Abrir Melhor Envio ↗
                    </a>
                  </div>
                )}

                <form ref={formRef} key={view.operation||'empty'} className="mt-5" onSubmit={event=>{event.preventDefault();void run('quote')}}>
                  <fieldset disabled={busy||locked} className="grid gap-4 sm:grid-cols-2">
                    <label className="text-xs">
                      ID da agência de postagem, se exigido
                      <input name="agency" defaultValue={view.agency} maxLength={9} inputMode="numeric" onChange={()=>setDirty(true)} className="mt-2 min-h-[44px] w-full rounded-xl border border-[#DDD4C7] px-3 text-sm"/>
                    </label>

                    <label className="text-xs">
                      CNAE do remetente, se exigido
                      <input name="cnae" defaultValue={view.cnae} maxLength={12} inputMode="numeric" onChange={()=>setDirty(true)} className="mt-2 min-h-[44px] w-full rounded-xl border border-[#DDD4C7] px-3 text-sm"/>
                    </label>

                    <button type="submit" className="w-fit rounded-full border border-[#BDA98B] bg-white px-5 py-3 text-xs disabled:opacity-50">
                      {busy?'Consultando…':'Conferir custo atual'}
                    </button>
                  </fieldset>

                  {!locked&&view.choices.length>0&&(
                    <>
                      <p className="mt-4 text-xs text-[#756B5D]">
                        Escolha o serviço para preparar. O frete cobrado no pedido será mantido.
                      </p>

                      <div className="mt-3 grid gap-3 sm:grid-cols-2">
                        {view.choices.map(q=>(
                          <label key={q.id} className={`flex items-start gap-3 rounded-xl border bg-white p-4 ${selected===q.id?'border-[#947B57]':'border-[#E5DED3]'}`}>
                            <input type="radio" name="service" checked={selected===q.id} onChange={()=>setSelected(q.id)} disabled={busy} className="mt-1"/>
                            <span className="min-w-0">
                              <span className="block text-sm font-medium">{q.company} · {q.service}</span>
                              <span className="mt-1 block text-sm">Custo atual: {saleMoney(q.cents/100)}</span>
                              <span className="mt-1 block text-xs text-[#756B5D]">
                                {q.days===null?'Prazo a confirmar':`${q.days} dia(s) estimado(s) após a postagem`}
                              </span>
                            </span>
                          </label>
                        ))}
                      </div>

                      {option&&(
                        <p className="mt-4 text-xs">
                          Diferença entre frete cobrado e custo cotado: <strong>{saleMoney(view.charged-option.cents/100)}</strong>
                        </p>
                      )}

                      <p className="mt-3 text-xs text-[#756B5D]">
                        A cotação vale por 15 minutos. Ainda não representa uma despesa paga.
                      </p>

                      {(view.stale||dirty)&&(
                        <p className="mt-3 text-xs text-[#8A6532]">
                          Os dados mudaram. Confira o custo novamente antes de preparar.
                        </p>
                      )}

                      <button type="button" disabled={busy||!option||view.stale||dirty||view.issues.length>0||view.state!=='quoted'} onClick={()=>void run('prepare')} className="mt-4 rounded-full bg-[#292621] px-6 py-3 text-xs text-white disabled:opacity-40">
                        Preparar no carrinho — sem pagar
                      </button>
                    </>
                  )}
                </form>

                {view.state!=='prepared'&&view.issues.length>0&&(
                  <div className="mt-5 rounded-xl bg-white p-4">
                    <h3 className="text-xs font-medium">Para preparar no Melhor Envio</h3>
                    <ul className="mt-3 list-disc space-y-2 pl-4 text-xs leading-relaxed text-[#756B5D]">
                      {view.issues.map((issue,index)=><li key={index}>{issue}</li>)}
                    </ul>
                    <p className="mt-3 text-xs text-[#756B5D]">
                      Você pode consultar o custo antes de concluir essas pendências.
                    </p>
                  </div>
                )}

                {['creating','uncertain'].includes(view.state)&&(
                  <div className="mt-5 rounded-xl border border-[#D5B98E] bg-white p-4">
                    <p className="text-xs leading-relaxed">
                      Confira o carrinho na sua conta do Melhor Envio. Se o envio já estiver lá, copie o ID para recuperar o vínculo. O sistema não repetirá automaticamente a criação.
                    </p>

                    <label className="mt-4 block text-xs">
                      ID do envio existente
                      <input value={remoteId} onChange={event=>setRemoteId(event.target.value)} maxLength={36} className="mt-2 min-h-[44px] w-full rounded-xl border border-[#DDD4C7] px-3 text-sm"/>
                    </label>

                    <button type="button" disabled={busy||!remoteId} onClick={()=>void run('recover')} className="mt-3 rounded-full border border-[#BDA98B] px-5 py-3 text-xs disabled:opacity-50">
                      Recuperar envio existente
                    </button>

                    <a href="https://melhorenvio.com.br" target="_blank" rel="noopener noreferrer" className="ml-4 inline-block py-3 text-xs underline">
                      Abrir Melhor Envio ↗
                    </a>
                  </div>
                )}

                <p role="status" className="mt-4 text-sm">{message}</p>
              </section>
            )
          }
          ''',

          'src/lib/label-cart-server.ts': r'''import 'server-only'
          import { randomUUID } from 'node:crypto'
          import type { SupabaseClient } from '@supabase/supabase-js'
          import type { LabelFields } from '@/lib/label-draft'
          import type { LabelJobView } from '@/lib/label-cart'
          import { partyIssues } from '@/lib/label-draft'
          import { loadLabelPreparation } from '@/lib/label-draft-server'
          import { melhorEnvio,readQuotes } from '@/lib/melhor-envio'
          import { saleUuid } from '@/lib/admin-sales'

          type Row=Record<string,unknown>
          const row=(v:unknown):Row=>v&&typeof v==='object'&&!Array.isArray(v) ? v as Row : {}
          const digits=(value:unknown)=>String(value||'').replace(/\D/g,'')

          function amount(value:unknown):number|null {
            if(typeof value!=='number'&&(typeof value!=='string'||!/^\d+(?:\.\d+)?$/.test(value)))return null
            const n=Number(value)
            return Number.isFinite(n)&&n>=0&&n<=1000000 ? n : null
          }

          function metric(value:unknown,max=1000,decimals=2):number {
            const raw=String(value??'').trim()
            if(!new RegExp('^\\d+(?:[.,]\\d{1,'+decimals+'})?$').test(raw))throw new Error('Confira o pacote no rascunho e salve antes de cotar.')
            const n=Number(raw.replace(',','.'))
            if(!Number.isFinite(n)||n<=0||n>max)throw new Error('Confira o peso e as dimensões do pacote.')
            return n
          }

          export function operationTag(operation:string){
            return 'serenity-'+operation
          }

          export async function labelSource(db:SupabaseClient,id:string){
            const [o,s,c,d]=await Promise.all([
              db.from('serenity_orders').select('*').eq('id',id).single(),
              db.from('serenity_label_sender').select('*').eq('singleton',true).single(),
              db.from('serenity_shipping_settings').select('*').eq('singleton',true).single(),
              db.from('serenity_label_drafts').select('*').eq('order_id',id).maybeSingle(),
            ])

            if(o.error||s.error||c.error||d.error)throw new Error('Não foi possível carregar os dados do envio.')

            const draft=await loadLabelPreparation(db,o.data)
            const sender=row(s.data.fields) as LabelFields,order=o.data

            return {
              order,sender,draft,draftRecord:d.data,config:c.data,
              senderVersion:Number(s.data.version),
              draftVersion:Number(d.data?.version||0)
            }
          }

          export async function loadLabelJobView(db:SupabaseClient,id:string):Promise<LabelJobView>{
            const source=await labelSource(db,id)
            const {data:job,error}=await db.from('serenity_label_jobs').select('*').eq('order_id',id).maybeSingle()
            if(error)throw new Error('LABEL_JOB_QUERY')

            const choices=(Array.isArray(job?.quotes)?job.quotes:[]).map((input:unknown)=>{
              const q=row(input)
              return {
                id:String(q.id),company:String(q.company),
                service:String(q.service),cents:Number(q.cents),
                days:q.days==null?null:Number(q.days)
              }
            })

            const issues=[
              ...partyIssues(source.sender,'Remetente'),
              ...partyIssues(source.draft.fields,'Destinatário')
            ]

            if(source.order.status!=='paid'||source.order.shipping_pending)
              issues.push('Confirme o pagamento e o frete do pedido antes de preparar no Melhor Envio.')

            if(digits(source.sender.cep)!==String(source.config.origin))
              issues.push('O CEP do remetente precisa coincidir com a origem configurada na aba Frete.')

            if(source.draft.fields.document_mode!=='invoice'||!/^\d{44}$/.test(source.draft.fields.invoice_key))
              issues.push('Documentação pendente: informe a chave real da NF-e no rascunho quando a loja confirmar a emissão.')

            if(!source.sender.state_register)
              issues.push('Confira a inscrição estadual / situação do remetente.')

            if(Number(source.order.discount)!==0)
              issues.push('Este pedido tem desconto. Os valores declarados precisam de conferência antes da preparação automática.')

            if(source.draftRecord&&(String(source.draftRecord.order_version)!==String(source.order.updated_at)||Number(source.draftRecord.sender_version)!==source.senderVersion))
              issues.push('O pedido ou remetente mudou. Confira e salve o rascunho novamente antes de preparar.')

            const stale=Boolean(job&&(
              String(job.order_version)!==String(source.order.updated_at)||
              Number(job.sender_version)!==source.senderVersion||
              Number(job.draft_version)!==source.draftVersion||
              Number(job.settings_version)!==Number(source.config.version)
            ))

            return {
              orderId:id,
              operation:String(job?.operation||''),
              state:String(job?.state||'empty'),
              expires:String(job?.quote_expires||''),
              stale,
              charged:Number(source.order.shipping||0),
              choices,
              issues,
              remoteId:String(job?.remote_id||''),
              remotePrice:job?.remote_price==null?null:Number(job.remote_price),
              agency:String(row(job?.context).agency||''),
              cnae:String(row(job?.context).cnae||'')
            }
          }

          export async function quoteLabel(db:SupabaseClient,id:string,actor:string,contact:string,extras:{agency:string;cnae:string}){
            const source=await labelSource(db,id),f=source.draft.fields
            if(!['pending','paid'].includes(source.order.status))throw new Error('Este pedido não está disponível para envio.')

            const {data:current,error:jobError}=await db.from('serenity_label_jobs').select('state').eq('order_id',id).maybeSingle()
            if(jobError)throw jobError
            if(current&&['creating','prepared','uncertain'].includes(current.state))throw new Error('LABEL_JOB_LOCKED')

            const cep=digits(f.cep)
            if(!/^\d{8}$/.test(cep))throw new Error('Preencha o CEP do destinatário no rascunho e salve.')

            const products=source.draft.products.map(p=>({
              name:p.name.slice(0,180),
              quantity:p.quantity,
              unitary_value:p.value
            }))

            if(!products.length||products.some(p=>!p.name||!Number.isInteger(p.quantity)||p.quantity<1||!Number.isFinite(p.unitary_value)||p.unitary_value<0))
              throw new Error('Confira os itens do pedido.')

            const insurance=Math.round(products.reduce((sum,p)=>sum+p.quantity*p.unitary_value,0)*100)/100
            const volume={
              height:metric(f.height),
              width:metric(f.width),
              length:metric(f.length),
              weight:metric(f.weight_g,1000000)/1000
            }

            const raw=await melhorEnvio('calculate',contact,{
              from:{postal_code:source.config.origin},
              to:{postal_code:cep},
              volumes:[{...volume,insurance}],
              options:{receipt:false,own_hand:false}
            })

            const quotes=readQuotes(raw).slice(0,50).map(q=>({
              id:randomUUID(),
              company:q.company,
              service:q.service,
              cents:Math.round(q.price*100),
              days:q.days,
              provider:raw.find(v=>String(row(v).id)===q.id)
            })).filter(q=>q.cents<=100000000)

            if(!quotes.length)throw new Error('Nenhum serviço disponível para esse CEP e pacote.')

            const context={
              sender:source.sender,
              recipient:f,
              products,
              volume,
              insurance,
              origin:source.config.origin,
              agency:extras.agency,
              cnae:extras.cnae,
              orderNumber:source.order.number
            }

            const {error}=await db.rpc('serenity_label_job_quote',{
              p_order:id,
              p_operation:randomUUID(),
              p_order_version:source.order.updated_at,
              p_sender:source.senderVersion,
              p_draft:source.draftVersion,
              p_settings:Number(source.config.version),
              p_context:context,
              p_quotes:quotes,
              p_actor:actor
            })

            if(error)throw error
          }

          function party(fields:LabelFields){
            const doc=String(fields.document||'').replace(/[^a-zA-Z0-9]/g,'').toUpperCase()
            return {
              name:fields.name,
              email:fields.email,
              phone:digits(fields.phone),
              ...(doc.length===11?{document:doc}:{company_document:doc}),
              state_register:fields.state_register||'',
              address:fields.street,
              number:fields.number,
              complement:fields.complement||'',
              district:fields.district,
              city:fields.city,
              postal_code:digits(fields.cep),
              state_abbr:fields.state.toUpperCase(),
              country_id:'BR'
            }
          }

          export function labelPayload(contextInput:unknown,choiceInput:unknown,operation:string){
            const context=row(contextInput),choice=row(choiceInput),provider=row(choice.provider)
            const sender=row(context.sender) as LabelFields,recipient=row(context.recipient) as LabelFields

            if(partyIssues(sender,'Remetente').length||partyIssues(recipient,'Destinatário').length)
              throw new Error('Complete os dados do remetente e destinatário.')

            if(recipient.document_mode!=='invoice'||!/^\d{44}$/.test(recipient.invoice_key)||!sender.state_register)
              throw new Error('Confirme a documentação e preencha a chave real da NF-e no rascunho.')

            if(digits(sender.cep)!==String(context.origin))
              throw new Error('Confira o CEP do remetente e a origem do frete.')

            const service=Number(provider.id)
            if(!Number.isSafeInteger(service)||service<=0)
              throw new Error('Serviço inválido. Confira o custo novamente.')

            const packages=provider.packages
            if(!Array.isArray(packages)||packages.length!==1)
              throw new Error('A transportadora não retornou um único volume. Este envio precisa de revisão antes de preparar.')

            const pack=row(packages[0]),dimensions=row(pack.dimensions)
            const volume={
              height:metric(dimensions.height??pack.height,1000,6),
              width:metric(dimensions.width??pack.width,1000,6),
              length:metric(dimensions.length??pack.length,1000,6),
              weight:metric(pack.weight,1000,6)
            }

            return {
              service,
              from:{
                ...party(sender),
                ...(context.cnae?{economic_activity_code:String(context.cnae)}:{})
              },
              to:party(recipient),
              products:context.products,
              volumes:[volume],
              ...(context.agency?{agency:Number(context.agency)}:{}),
              options:{
                platform:'Serenity Site',
                reminder:'Pedido #'+String(context.orderNumber),
                insurance_value:Number(context.insurance),
                receipt:false,
                own_hand:false,
                reverse:false,
                invoice:{key:recipient.invoice_key},
                tags:[{tag:operationTag(operation),url:null}]
              }
            }
          }

          export async function labelCartRequest(method:'GET'|'POST',contact:string,id?:string,body?:unknown):Promise<unknown>{
            const token=process.env.MELHOR_ENVIO_TOKEN?.trim()
            if(!token||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact))throw new Error('LABEL_CONFIG')
            if(id&&!saleUuid(id))throw new Error('LABEL_INVALID')

            const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),18000)

            try{
              const response=await fetch('https://www.melhorenvio.com.br/api/v2/me/cart'+(id?'/'+id:''),{
                method,
                headers:{
                  Authorization:'Bearer '+token.replace(/^Bearer\s+/i,''),
                  Accept:'application/json',
                  'Content-Type':'application/json',
                  'User-Agent':`Serenity Site (${contact})`
                },
                body:method==='POST'?JSON.stringify(body):undefined,
                cache:'no-store',
                redirect:'error',
                signal:controller.signal
              })

              if([401,403,422].includes(response.status))throw new Error('LABEL_REMOTE_REJECTED')
              if(!response.ok)throw new Error('LABEL_REMOTE_UNKNOWN')
              return await response.json()
            }finally{
              clearTimeout(timer)
            }
          }

          export function remoteCart(input:unknown){
            const value=row(input)
            return value.data&&typeof value.data==='object'&&!Array.isArray(value.data)?row(value.data):value
          }

          export function remotePrice(input:unknown){
            const r=remoteCart(input)
            return amount(r.custom_price??r.price)
          }

          export function verifyRemote(input:unknown,id:string,operation:string){
            const r=remoteCart(input),tag=operationTag(operation)
            const tags=Array.isArray(r.tags)?r.tags:Array.isArray(row(r.options).tags)?row(r.options).tags as unknown[]:[]

            if(String(r.id).toLowerCase()!==id.toLowerCase()||!tags.some(v=>typeof v==='string'?v===tag:row(v).tag===tag))
              throw new Error('O ID não corresponde à preparação deste pedido ou não foi possível confirmar sua identificação.')

            return r
          }

          export function labelJobError(error:unknown){
            const text=error&&typeof error==='object'&&'message' in error?String(error.message):''

            const messages:Record<string,string>={
              LABEL_JOB_LOCKED:'Já existe uma preparação em andamento ou um envio vinculado. Confira o estado abaixo antes de continuar.',
              LABEL_STALE:'Os dados foram alterados. Salve o rascunho, atualize a página e confira o custo novamente.',
              LABEL_QUOTE_EXPIRED:'A cotação expirou. Confira o custo novamente.',
              LABEL_PAYMENT:'Confirme o pagamento e o frete do pedido antes de preparar.',
              LABEL_REMOTE_REJECTED:'O Melhor Envio recusou a preparação. Confira documentação, dados, agência da transportadora e permissões do token. Corrija e consulte o custo novamente.',
              LABEL_CONFIG:'Confira o token do Melhor Envio e o e-mail da sua conta de administrador.',
              LABEL_REMOTE_UNKNOWN:'Não foi possível confirmar o resultado. Confira o carrinho do Melhor Envio e recupere o envio pelo ID antes de tentar criar outro.'
            }

            if(messages[text])return messages[text]
            if(/^ME_/.test(text))return 'Não foi possível consultar o custo no Melhor Envio. Confira a conexão na aba Frete.'
            if(error instanceof Error&&!/^[A-Z_]+$/.test(text)&&text.length<240&&!/fetch|abort|network|JSON|token/i.test(text))return text
            return 'A operação não terminou. Atualize a página para conferir o estado antes de continuar.'
          }
          ''',

          'src/lib/label-cart.ts': r'''export interface LabelChoice {
            id:string
            company:string
            service:string
            cents:number
            days:number|null
          }

          export interface LabelJobView {
            orderId:string
            operation:string
            state:string
            expires:string
            stale:boolean
            charged:number
            choices:LabelChoice[]
            issues:string[]
            remoteId:string
            remotePrice:number|null
            agency:string
            cnae:string
          }
          ''',
          }

          marker = '// Serenity: custo e carrinho de etiquetas v1'

          def read(name):
              path = root / name
              if not path.is_file():
                  raise SystemExit(
                      'Falta o arquivo ' + name +
                      '. Nenhum arquivo foi alterado.'
                  )
              return path.read_text(encoding='utf-8')

          read('src/lib/label-draft-server.ts')

          name = 'src/app/admin/pedidos/[id]/page.tsx'
          source = read(name)

          if marker not in source:
              source, count = re.subn(
                  r'(\bconst\s+margin\s*=)',
                  r'const labelOperations = await loadLabelJobView(db, order.id)\n  \1',
                  source,
                  count=1
              )
              if count != 1:
                  raise SystemExit(
                      'Envie a tela atual do pedido para incluir a cotação. '
                      'Nenhum arquivo foi alterado.'
                  )

              source, count = re.subn(
                  r'<OrderOrigin\b',
                  '<LabelOperations initial={labelOperations} /><OrderOrigin',
                  source,
                  count=1
              )
              if count != 1:
                  raise SystemExit(
                      'Não encontrei a seção do envio. '
                      'Nenhum arquivo foi alterado.'
                  )

              files[name] = (
                  "import LabelOperations from '@/components/admin/LabelOperations'\n"
                  "import { loadLabelJobView } from '@/lib/label-cart-server'\n"
                  + source + '\n' + marker + '\n'
              )

          name = 'src/components/admin/LabelPreparation.tsx'
          source = read(name)
          source = source.replace(
              'Esta etapa não envia dados ao Melhor Envio nem compra uma etiqueta.',
              'Salvar o rascunho não envia dados ao Melhor Envio nem compra uma etiqueta.'
          )
          files[name] = source

          name = 'src/app/admin/frete/label-actions.ts'
          source = read(name)

          if marker not in source:
              source, count = re.subn(
                  r"(?=if\s*\(\s*message\.includes\(['\"]LABEL_STALE['\"]\)\s*\))",
                  "if (message.includes('LABEL_JOB_LOCKED')) return 'Já existe uma preparação em andamento ou vinculada ao Melhor Envio. Confira o estado do envio antes de editar.'\n  ",
                  source,
                  count=1
              )
              files[name] = source + '\n' + marker + '\n'

          for name, content in files.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          print(
              'Conferência de custo e preparo no carrinho instalados. '
              'Nenhum frete foi comprado pelo instalador.'
          )
          PY

      - run: npm ci --ignore-scripts

      - run: npx tsc --noEmit --incremental false

      - run: npx next lint --no-cache

      - name: Salvar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/app/admin/frete/cart-actions.ts src/app/admin/frete/label-actions.ts src/app/admin/pedidos/'[id]'/page.tsx src/components/admin/LabelOperations.tsx src/components/admin/LabelPreparation.tsx src/lib/label-cart.ts src/lib/label-cart-server.ts

          if git diff --cached --quiet; then
            echo "Custo e preparo já instalados."
          else
            git commit -m "Conferir custo e preparar frete no carrinho com proteção contra duplicação"
            git push origin HEAD:main
          fi
