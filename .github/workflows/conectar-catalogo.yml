          "src/app/categoria/[slug]/page.tsx": r"""
          import { notFound } from 'next/navigation'
          import { getStoreCategory, getStorePage } from '@/lib/catalog-server'
          import CategoryPageClient from './CategoryPageClient'

          interface Props {
            params: { slug: string }
            searchParams?: Record<string, string | string[] | undefined>
          }

          function value(input: string | string[] | undefined): string {
            return Array.isArray(input) ? input[0] || '' : input || ''
          }

          export async function generateMetadata({ params }: Props) {
            const category = await getStoreCategory(params.slug)
            return {
              title: category?.name || 'Categoria não encontrada',
              description: category?.description || undefined,
            }
          }

          export default async function CategoryPage({ params, searchParams = {} }: Props) {
            const category = await getStoreCategory(params.slug)
            if (!category) notFound()

            const sort = value(searchParams.sort) || 'default'
            const material = value(searchParams.material) || 'all'

            const result = await getStorePage({
              category: params.slug,
              material,
              sort,
              page: Number(value(searchParams.page)) || 1,
              perPage: 12,
            })

            return (
              <CategoryPageClient
                products={result.products}
                categoryName={category.name}
                categoryDescription={category.description}
                materials={category.materials}
                material={material}
                sort={sort}
                page={result.page}
                total={result.total}
                totalPages={result.totalPages}
              />
            )
          }
          """,

          "src/app/categoria/[slug]/CategoryPageClient.tsx": r"""
          'use client'

          import { useTransition } from 'react'
          import { usePathname, useRouter } from 'next/navigation'
          import Link from 'next/link'
          import type { Product } from '@/lib/data'
          import ProductCard from '@/components/ui/ProductCard'
          import { ChevronDown } from 'lucide-react'

          interface Props {
            products: Product[]
            categoryName: string
            categoryDescription: string
            materials: string[]
            material: string
            sort: string
            page: number
            total: number
            totalPages: number
          }

          const SORT_OPTIONS = [
            { value: 'default', label: 'Padrão' },
            { value: 'price-asc', label: 'Menor preço' },
            { value: 'price-desc', label: 'Maior preço' },
            { value: 'name-asc', label: 'A-Z' },
          ]

          export default function CategoryPageClient(props: Props) {
            const router = useRouter()
            const pathname = usePathname()
            const [pending, startTransition] = useTransition()

            function href(page: number, material = props.material, sort = props.sort) {
              const query = new URLSearchParams()
              if (page > 1) query.set('page', String(page))
              if (material !== 'all') query.set('material', material)
              if (sort !== 'default') query.set('sort', sort)
              return `${pathname}${query.size ? `?${query}` : ''}`
            }

            function change(material: string, sort: string) {
              startTransition(() => {
                router.push(href(1, material, sort))
              })
            }

            const pages = Array.from(new Set([
              1, props.page - 2, props.page - 1, props.page,
              props.page + 1, props.page + 2, props.totalPages,
            ])).filter((page) => page >= 1 && page <= props.totalPages)
              .sort((a, b) => a - b)

            return (
              <div className="min-h-screen bg-[#FAFAF8]" aria-busy={pending}>
                <div className="border-b border-[#E5E5E5] bg-white">
                  <div className="mx-auto max-w-7xl px-4 py-12 md:py-16">
                    <h1 className="font-display text-5xl font-light md:text-6xl">{props.categoryName}</h1>
                    {props.categoryDescription && (
                      <p className="mt-3 max-w-xl text-[13px] text-[#6B6B6B]">{props.categoryDescription}</p>
                    )}
                    <p className="mt-4 text-[11px] uppercase tracking-wide text-[#6B6B6B]">{props.total} produtos</p>
                  </div>
                </div>

                <div className="mx-auto max-w-7xl px-4 py-8">
                  <div className="mb-8 flex flex-wrap items-center justify-between gap-4 border-b border-[#E5E5E5] pb-4">
                    <div className="flex flex-wrap gap-2">
                      {['all', ...props.materials].map((material) => (
                        <button
                          key={material}
                          type="button"
                          disabled={pending}
                          onClick={() => change(material, props.sort)}
                          className={`border px-4 py-2 text-[11px] uppercase tracking-[0.1em] transition-colors disabled:opacity-50 ${
                            props.material === material
                              ? 'border-[#0A0A0A] bg-[#0A0A0A] text-white'
                              : 'border-[#E5E5E5] text-[#6B6B6B] hover:border-[#0A0A0A]'
                          }`}
                        >
                          {material === 'all' ? 'Todos' : material}
                        </button>
                      ))}
                    </div>

                    <div className="relative">
                      <select
                        aria-label="Ordenar produtos"
                        value={props.sort}
                        disabled={pending}
                        onChange={(event) => change(props.material, event.target.value)}
                        className="appearance-none border border-[#E5E5E5] bg-white px-4 py-2 pr-8 text-[12px] focus:outline-none disabled:opacity-50"
                      >
                        {SORT_OPTIONS.map((option) => (
                          <option key={option.value} value={option.value}>{option.label}</option>
                        ))}
                      </select>
                      <ChevronDown size={14} className="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-[#6B6B6B]" />
                    </div>
                  </div>

                  <div className={pending ? 'opacity-50' : ''}>
                    {props.products.length ? (
                      <div className="grid grid-cols-2 gap-4 md:grid-cols-3 md:gap-6 lg:grid-cols-4">
                        {props.products.map((product) => (
                          <ProductCard key={product.id} product={product} />
                        ))}
                      </div>
                    ) : (
                      <p className="py-20 text-center text-sm text-[#6B6B6B]">Nenhum produto encontrado</p>
                    )}
                  </div>

                  {props.totalPages > 1 && (
                    <nav aria-label="Paginação" className="mt-12 flex flex-wrap items-center justify-center gap-2">
                      {props.page > 1 && (
                        <Link prefetch={false} href={href(props.page - 1)} aria-label="Página anterior" className="border px-4 py-3 text-xs">←</Link>
                      )}
                      {pages.map((page, index) => (
                        <span key={page} className="flex items-center gap-2">
                          {index > 0 && page - pages[index - 1] > 1 && <span>…</span>}
                          <Link
                            prefetch={false}
                            href={href(page)}
                            aria-current={page === props.page ? 'page' : undefined}
                            className={`border px-4 py-3 text-xs ${page === props.page ? 'border-black bg-black text-white' : 'border-[#E5E5E5]'}`}
                          >
                            {page}
                          </Link>
                        </span>
                      ))}
                      {props.page < props.totalPages && (
                        <Link prefetch={false} href={href(props.page + 1)} aria-label="Próxima página" className="border px-4 py-3 text-xs">→</Link>
                      )}
                    </nav>
                  )}
                </div>
              </div>
            )
          }
          """,

          "src/app/busca/page.tsx": r"""
          import Link from 'next/link'
          import { Search } from 'lucide-react'
          import { getStorePage } from '@/lib/catalog-server'
          import ProductCard from '@/components/ui/ProductCard'

          interface Props {
            searchParams?: Record<string, string | string[] | undefined>
          }

          function value(input: string | string[] | undefined) {
            return Array.isArray(input) ? input[0] || '' : input || ''
          }

          export const metadata = { title: 'Buscar produtos' }

          export default async function SearchPage({ searchParams = {} }: Props) {
            const query = value(searchParams.q).trim().slice(0, 120)
            const result = query.length >= 2
              ? await getStorePage({
                  search: query,
                  page: Number(value(searchParams.page)) || 1,
                  perPage: 12,
                })
              : { products: [], total: 0, page: 1, totalPages: 0 }

            function href(page: number) {
              return `/busca?${new URLSearchParams({
                q: query, page: String(page),
              })}`
            }

            const pages = Array.from(new Set([
              1, result.page - 1, result.page,
              result.page + 1, result.totalPages,
            ])).filter((page) => page >= 1 && page <= result.totalPages)
              .sort((a, b) => a - b)

            return (
              <div className="min-h-screen bg-[#FAFAF8]">
                <div className="border-b border-[#E5E5E5] bg-white">
                  <div className="mx-auto max-w-3xl px-4 py-12">
                    <h1 className="mb-6 font-display text-4xl font-light">Buscar</h1>

                    <form action="/busca" method="get" className="flex items-center gap-3 border-b-2 border-[#0A0A0A] pb-2">
                      <Search size={18} strokeWidth={1.5} className="shrink-0 text-[#6B6B6B]" />
                      <input
                        key={query}
                        name="q"
                        type="search"
                        defaultValue={query}
                        maxLength={120}
                        placeholder="Buscar piercings, materiais, estilos..."
                        aria-label="Buscar produtos"
                        className="min-w-0 flex-1 bg-transparent text-[16px] outline-none placeholder:text-[#aaa]"
                      />
                      <button type="submit" className="text-xs uppercase tracking-wide">Buscar</button>
                      {query && <Link href="/busca" className="text-xs text-[#6B6B6B]">Limpar</Link>}
                    </form>
                  </div>
                </div>

                <div className="mx-auto max-w-7xl px-4 py-10">
                  {query.length >= 2 ? (
                    <>
                      <p className="mb-6 text-[12px] uppercase tracking-wide text-[#6B6B6B]">
                        {result.total} resultado{result.total !== 1 ? 's' : ''} para “{query}”
                      </p>

                      {result.products.length ? (
                        <div className="grid grid-cols-2 gap-4 md:grid-cols-3 md:gap-6 lg:grid-cols-4">
                          {result.products.map((product) => (
                            <ProductCard key={product.id} product={product} />
                          ))}
                        </div>
                      ) : (
                        <p className="py-20 text-center text-sm text-[#6B6B6B]">
                          Nenhum produto encontrado. Tente argola, septo, helix, titânio ou ouro.
                        </p>
                      )}

                      {result.totalPages > 1 && (
                        <nav aria-label="Paginação da busca" className="mt-12 flex flex-wrap justify-center gap-2">
                          {result.page > 1 && (
                            <Link prefetch={false} href={href(result.page - 1)} aria-label="Página anterior" className="border px-4 py-3 text-xs">←</Link>
                          )}
                          {pages.map((page, index) => (
                            <span key={page} className="flex items-center gap-2">
                              {index > 0 && page - pages[index - 1] > 1 && <span>…</span>}
                              <Link prefetch={false} href={href(page)} aria-current={page === result.page ? 'page' : undefined} className={`border px-4 py-3 text-xs ${page === result.page ? 'bg-black text-white' : ''}`}>
                                {page}
                              </Link>
                            </span>
                          ))}
                          {result.page < result.totalPages && (
                            <Link prefetch={false} href={href(result.page + 1)} aria-label="Próxima página" className="border px-4 py-3 text-xs">→</Link>
                          )}
                        </nav>
                      )}
                    </>
                  ) : (
                    <p className="py-20 text-center text-sm text-[#6B6B6B]">
                      Digite pelo menos 2 caracteres e pressione Buscar ou Enter.
                    </p>
                  )}
                </div>
              </div>
            )
          }
          """,

