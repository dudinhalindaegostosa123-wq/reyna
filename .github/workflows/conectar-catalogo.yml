              path.write_text(content.strip() + "\n", encoding="utf-8")
              print("Preparado:", name)

          Path(".catalog-updated-paths").write_text(
              "\n".join(files.keys()) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Instalar dependencias existentes
        run: npm ci

      - name: Verificar TypeScript antes de salvar
        run: npx --no-install tsc --noEmit

      - name: Salvar alteracoes verificadas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r file; do
            git add -- "$file"
          done < .catalog-updated-paths

          if git diff --cached --quiet; then
            echo "Os arquivos já estão atualizados."
          else
            git commit -m "Conecta catalogo completo ao Supabase com paginacao"
            git push
          fi

          {
            echo "# Código do catálogo atualizado"
            echo ""
            echo "- TypeScript verificado."
            echo "- Catálogo, categorias e busca consultam o Supabase."
            echo "- Categorias e busca exibem 12 produtos por página."
            echo "- Detalhes carregam as variações do produto selecionado."
            echo "- Header e logos preservados."
            echo ""
            echo "Aguarde o deploy da Vercel e teste /categoria/todos."
          } >> "$GITHUB_STEP_SUMMARY"
