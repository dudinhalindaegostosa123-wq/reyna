name: Conectar loja ao catalogo completo

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conectar-catalogo-serenity
  cancel-in-progress: false

jobs:
  conectar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar arquivos da loja
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
          "src/lib/data.ts": r"""
          export interface ProductVariant {
            id: string
            name: string
            value: string
            inStock: boolean
          }

          export interface ImportedVariation {
            id: string
            name: string
            sku: string
            price: number
            originalPrice?: number
            priceAvailable: boolean
            stock: number | null
            inStock: boolean
            image?: string
          }

          export interface Product {
            id: string
            slug: string
            name: string
            category: string
            categorySlug: string
            categorySlugs?: string[]
            price: number
            originalPrice?: number
            priceAvailable?: boolean
            stock?: number | null
            sku?: string
            description: string
            longDescription: string
            material: string
            images: string[]
            youtubeShortId?: string
            variants: {
              type: string
              label: string
              options: ProductVariant[]
            }[]
            variations?: ImportedVariation[]
            inStock: boolean
            isBestSeller: boolean
            isFeatured?: boolean
            isNew: boolean
            tags: string[]
            related: string[]
          }

          export interface Category {
            id: string
            name: string
            slug: string
            description: string
            image: string
            count: number
          }

          export function plainText(value: string = ''): string {
            return value
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, '')
              .replace(/\\n/g, '\n')
              .replace(/<br\s*\/?>/gi, '\n')
              .replace(/<\/(?:p|div|h[1-6]|li|ul|ol|tr|td|th)>/gi, '\n')
              .replace(/<[^>]*>/g, '')
              .replace(/&nbsp;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/gi, '<')
              .replace(/&gt;/gi, '>')
              .replace(/&#(\d+);/g, (_, number: string) => {
                const code = Number(number)
                return code >= 0 && code <= 1114111
                  ? String.fromCodePoint(code)
                  : ''
              })
              .replace(/\n{3,}/g, '\n\n')
              .trim()
          }

          export function formatPrice(price: number): string {
            return price.toLocaleString('pt-BR', {
              style: 'currency',
              currency: 'BRL',
            })
          }

          export function resolveProductSelection(
            product: Product,
            selected: Record<string, string>
          ): ImportedVariation | null {
            if (product.variations) {
              return product.variations.find(
                (variation) => variation.id === selected['Variação']
              ) || null
            }

            return {
              id: product.id,
              name: product.name,
              sku: product.sku || '',
              price: product.price,
              originalPrice: product.originalPrice,
              priceAvailable: product.priceAvailable !== false,
              stock: product.stock ?? null,
              inStock: product.inStock,
              image: product.images[0],
            }
          }

          // Compatibilidade com componentes antigos.
          // As páginas da loja consultam catalog-server.ts.
          export const PRODUCTS: Product[] = []
          export const CATEGORIES: Category[] = []

          export function getProductBySlug(slug: string) {
            return PRODUCTS.find((product) => product.slug === slug)
          }

          export function getProductsByCategory(slug: string) {
            return PRODUCTS.filter((product) =>
              (product.categorySlugs || [product.categorySlug]).includes(slug)
            )
          }

          export function getBestSellers() {
            return PRODUCTS.filter((product) => product.isBestSeller)
          }

          export function getNewArrivals() {
            return PRODUCTS.filter((product) => product.isNew)
          }

          export function getRelatedProducts(product: Product) {
            return PRODUCTS.filter((item) => product.related.includes(item.id))
          }

          export function getPaginatedProducts(
            products: Product[],
            page: number,
            perPage: number = 12
          ) {
            const size = Math.max(1, Math.floor(perPage) || 12)
            const current = Math.max(1, Math.floor(page) || 1)

            return {
              products: products.slice((current - 1) * size, current * size),
              total: products.length,
              totalPages: Math.ceil(products.length / size),
            }
          }
          """,

          "src/lib/catalog-server.ts": r"""
          import 'server-only'
          import { plainText } from './data'
          import type { Category, Product, ImportedVariation } from './data'

          interface Row {
            database_id: string
            id: string
            woo_id: number | null
            slug: string
            name: string
            product_type: string
            visibility: string
            sku: string | null
            short_description: string
            description?: string
            material: string
            categories: string[]
            category_slugs: string[]
            tags: string[]
            featured: boolean
            price: number | null
            original_price: number | null
            price_available: boolean
            in_stock: boolean
            stock_quantity: number | null
            storage_path: string | null
            thumbnail_path: string | null
            original_path: string | null
            search_text: string
            seo_title?: string | null
            seo_description?: string | null
            related_woo_ids?: number[]
          }

          interface Media {
            id: string
            variant_id: string | null
            media_type: string
            storage_path: string | null
            source_url: string | null
            youtube_id: string | null
            position: number
          }

          interface VariantRow {
            id: string
            woo_id: number | null
            name: string
            sku: string | null
            attributes: Record<string, string>
            regular_price: number | null
            sale_price: number | null
            sale_starts_at: string | null
            sale_ends_at: string | null
            stock_status: string
            stock_quantity: number | null
          }

          interface ParentStock {
            stock_quantity: number | null
            stock_status: string
            sold_individually: boolean
          }

          export interface StoreCategory extends Category {
            materials: string[]
          }

          export interface StorePage {
            products: Product[]
            total: number
            page: number
            totalPages: number
          }

          interface Options {
            category?: string
            search?: string
            material?: string
            sort?: string
            page?: number
            perPage?: number
            featured?: boolean
          }

          const RULES: Record<string, {
            name: string
            words: string[]
            exclude?: string[]
          }> = {
            'piercings-de-titanio': {
              name: 'Piercings de Titânio',
              words: ['titanio'],
            },
            'piercings-de-ouro-18k': {
              name: 'Piercings de Ouro 18k',
              words: ['ouro'],
              exclude: ['titanio', 'revestid', 'banhad'],
            },
            argolas: {
              name: 'Argolas',
              words: ['argola'],
            },
            'labrets-studs': {
              name: 'Labrets & Studs',
              words: ['labret', 'stud'],
            },
            'piercings-de-umbigo': {
              name: 'Piercings de Umbigo',
              words: ['umbigo'],
            },
            brincos: {
              name: 'Brincos',
              words: ['brinco'],
            },
          }

          const LIST_FIELDS = [
            'database_id', 'id', 'woo_id', 'slug', 'name',
            'product_type', 'visibility', 'sku', 'short_description',
            'material', 'categories', 'category_slugs', 'tags', 'featured',
            'price', 'original_price', 'price_available', 'in_stock',
            'stock_quantity', 'storage_path', 'thumbnail_path',
          ].join(',')

          function config() {
            const url = process.env.SUPABASE_URL?.trim().replace(/\/$/, '')
            const key = process.env.SUPABASE_PUBLISHABLE_KEY?.trim()

            if (!url || !key) {
              throw new Error('A conexão do catálogo não está configurada.')
            }

            return { url, key }
          }

          export function storageUrl(path?: string | null): string {
            if (!path) return ''
            return `${config().url}/storage/v1/object/public/produtos/${
              path.split('/').map(encodeURIComponent).join('/')
            }`
          }

          function normalize(value: string): string {
            return value.normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .toLowerCase()
          }

          function slugify(value: string): string {
            return normalize(value)
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '')
          }

          async function read<T>(
            table: string,
            parameters: Record<string, string> | URLSearchParams
          ): Promise<{ rows: T[]; total: number }> {
            const { url, key } = config()
            const query = new URLSearchParams(parameters)

            const response = await fetch(`${url}/rest/v1/${table}?${query}`, {
              headers: {
                apikey: key,
                Prefer: 'count=exact',
              },
              next: { revalidate: 60, tags: ['catalog'] },
            })

            if (!response.ok) {
              console.error('Falha no catálogo:', table, response.status)
              throw new Error('Não foi possível consultar o catálogo.')
            }

            const rows: T[] = await response.json()
            if (!Array.isArray(rows)) {
              throw new Error('Resposta inesperada do catálogo.')
            }

            const range = response.headers.get('content-range')
            const count = range ? Number(range.split('/')[1]) : NaN

            return {
              rows,
              total: Number.isFinite(count) ? count : rows.length,
            }
          }

          async function readAll<T>(
            table: string,
            select: string,
            filters: Record<string, string> = {},
            order: string = 'id.asc'
          ): Promise<T[]> {
            const result: T[] = []

            for (let offset = 0; ; offset += 500) {
              const page = await read<T>(table, {
                select, ...filters, order,
                limit: '500', offset: String(offset),
              })
              result.push(...page.rows)
              if (page.rows.length < 500) return result
            }
          }

          async function metadata(): Promise<Row[]> {
            const rows = await readAll<Row>(
              'store_catalog',
              [
                'database_id', 'id', 'name', 'material', 'categories',
                'category_slugs', 'featured', 'visibility',
                'storage_path', 'thumbnail_path', 'search_text',
              ].join(','),
              {},
              'woo_id.desc.nullslast,database_id.asc'
            )

            return rows.filter((row) =>
              row.visibility === 'visible' || row.visibility === 'catalog'
            )
          }

          function matches(row: Row, slug: string, real: boolean): boolean {
            if (slug === 'todos' || slug === 'novidades') return true
            if (slug === 'destaques') return row.featured
            if (real) return row.category_slugs.includes(slug)

            const rule = RULES[slug]
            if (!rule) return false

            return rule.words.some((word) => row.search_text.includes(word)) &&
              !(rule.exclude || []).some((word) =>
                row.search_text.includes(word)
              )
          }

          function categoriesFrom(rows: Row[]): Category[] {
            const groups = new Map<string, {
              name: string
              ids: Set<string>
              image: string
            }>()

            rows.forEach((row) => {
              row.categories.forEach((name) => {
                const slug = slugify(name)
                if (!slug) return

                const group = groups.get(slug) || {
                  name, ids: new Set<string>(), image: '',
                }

                group.ids.add(row.id)
                if (!group.image) {
                  group.image = storageUrl(
                    row.thumbnail_path || row.storage_path
                  )
                }
                groups.set(slug, group)
              })
            })

            return Array.from(groups.entries()).map(([slug, group]) => ({
              id: slug,
              slug,
              name: group.name,
              description: '',
              image: group.image,
              count: group.ids.size,
            })).sort((a, b) =>
              b.count - a.count || a.name.localeCompare(b.name, 'pt-BR')
            )
          }

          export async function getStoreCategories(): Promise<Category[]> {
            return categoriesFrom(await metadata())
          }

          export async function getStoreCategory(
            slug: string
          ): Promise<StoreCategory | null> {
            const rows = await metadata()
            const real = categoriesFrom(rows).find((item) => item.slug === slug)

            const special: Record<string, string> = {
              todos: 'Todas as joias',
              novidades: 'Novidades',
              destaques: 'Destaques',
            }

            const name = real?.name || special[slug] || RULES[slug]?.name
            if (!name) return null

            const scoped = rows.filter((row) => matches(row, slug, Boolean(real)))
            const imageRow = scoped.find((row) =>
              row.thumbnail_path || row.storage_path
            )

            return {
              id: slug,
              slug,
              name,
              description: slug === 'novidades'
                ? 'Explore as últimas peças adicionadas ao catálogo.'
                : '',
              count: scoped.length,
              image: imageRow
                ? storageUrl(imageRow.thumbnail_path || imageRow.storage_path)
                : '',
              materials: Array.from(new Set(
                scoped.map((row) => row.material).filter(Boolean)
              )).sort((a, b) => a.localeCompare(b, 'pt-BR')),
            }
          }

          function asProduct(row: Row): Product {
            const variable = row.product_type === 'variable'
            const image = storageUrl(row.thumbnail_path || row.storage_path)

            return {
              id: row.id,
              slug: row.slug,
              name: row.name,
              category: row.categories[0] || 'Joias',
              categorySlug: slugify(row.categories[0] || 'todos'),
              categorySlugs: row.category_slugs,
              price: Number(row.price ?? 0),
              originalPrice: row.original_price === null
                ? undefined : Number(row.original_price),
              priceAvailable: row.price_available,
              stock: row.stock_quantity,
              sku: row.sku || '',
              description: plainText(row.short_description || ''),
              longDescription: row.description || '',
              material: row.material,
              images: image ? [image] : [],
              variants: variable
                ? [{ type: 'variation', label: 'Variação', options: [] }]
                : [],
              variations: variable ? [] : undefined,
              inStock: row.in_stock,
              isBestSeller: false,
              isFeatured: row.featured,
              isNew: false,
              tags: row.tags,
              related: [],
            }
          }

          export async function getStorePage(
            options: Options = {}
          ): Promise<StorePage> {
            const size = Math.min(24, Math.max(1, options.perPage || 12))
            let page = Math.max(1, Math.floor(options.page || 1))
            if (!Number.isFinite(page)) page = 1

            const query = new URLSearchParams({
              select: LIST_FIELDS,
              visibility: options.search
                ? 'in.(visible,search)' : 'in.(visible,catalog)',
              limit: String(size),
              offset: String((page - 1) * size),
            })

            const orders: Record<string, string> = {
              default: 'created_at.desc,woo_id.desc.nullslast,database_id.asc',
              'price-asc': 'price.asc.nullslast,name.asc,database_id.asc',
              'price-desc': 'price.desc.nullslast,name.asc,database_id.asc',
              'name-asc': 'name.asc,database_id.asc',
            }
            query.set('order', orders[options.sort || 'default'] || orders.default)

            if (options.featured || options.category === 'destaques') {
              query.set('featured', 'eq.true')
            }

            const slug = options.category

            if (slug && !['todos', 'novidades', 'destaques'].includes(slug)) {
              const rows = await metadata()
              const real = rows.some((row) => row.category_slugs.includes(slug))

              if (real) {
                if (!/^[a-z0-9-]+$/.test(slug)) {
                  throw new Error('Categoria inválida.')
                }
                query.set('category_slugs', `cs.{${slug}}`)
              } else {
                const rule = RULES[slug]
                if (!rule) {
                  return { products: [], total: 0, page: 1, totalPages: 0 }
                }

                if (rule.words.length === 1) {
                  query.append('search_text', `like.*${rule.words[0]}*`)
                } else {
                  query.set('or', `(${
                    rule.words.map((word) => `search_text.like.*${word}*`).join(',')
                  })`)
                }

                ;(rule.exclude || []).forEach((word) => {
                  query.append('search_text', `not.like.*${word}*`)
                })
              }
            }

            if (options.material && options.material !== 'all') {
              query.set('material', `eq.${options.material}`)
            }

            const words = normalize(options.search || '')
              .replace(/[,*%_\\()"']/g, ' ')
              .trim().split(/\s+/).filter(Boolean).slice(0, 6)

            words.forEach((word) => {
              query.append('search_text', `like.*${word}*`)
            })

            let result = await read<Row>('store_catalog', query)
            const totalPages = Math.ceil(result.total / size)

            if (totalPages > 0 && page > totalPages) {
              page = totalPages
              query.set('offset', String((page - 1) * size))
              result = await read<Row>('store_catalog', query)
            }

            return {
              products: result.rows.map(asProduct),
              total: result.total,
              page: result.total === 0 ? 1 : page,
              totalPages,
            }
          }

          function variantPrice(row: VariantRow) {
            const regular = row.regular_price === null
              ? null : Number(row.regular_price)
            const sale = row.sale_price === null ? null : Number(row.sale_price)
            const now = Date.now()

            const active = regular !== null && sale !== null &&
              sale >= 0 && sale < regular &&
              (!row.sale_starts_at || Date.parse(row.sale_starts_at) <= now) &&
              (!row.sale_ends_at || Date.parse(row.sale_ends_at) >= now)

            return {
              price: (active ? sale : regular) ?? 0,
              originalPrice: active ? regular! : undefined,
              priceAvailable: regular !== null,
            }
          }

          interface Asset {
            storage_path: string
          }

          let manifestPromise: Promise<Record<string, Asset>> | null = null
          let manifestExpires = 0

          async function imageManifest(): Promise<Record<string, Asset>> {
            if (manifestPromise && Date.now() < manifestExpires) {
              return manifestPromise
            }

            manifestExpires = Date.now() + 300000
            manifestPromise = fetch(
              storageUrl('migracao-v1/manifesto.json'),
              { cache: 'no-store' }
            ).then(async (response) => {
              if (!response.ok) throw new Error('Manifesto de imagens indisponível.')
              const data = await response.json()
              return (data.images || {}) as Record<string, Asset>
            }).catch((error) => {
              manifestPromise = null
              throw error
            })

            return manifestPromise
          }

          async function descriptionPhotos(description: string): Promise<string[]> {
            const tags = description.match(/<img\b[^>]*>/gi) || []
            if (!tags.length) return []

            const manifest = await imageManifest()
            const photos: string[] = []

            tags.forEach((tag) => {
              for (const field of ['data-src', 'data-lazy-src', 'src']) {
                const pattern = new RegExp(
                  `\\b${field}\\s*=\\s*["']([^"']+)["']`, 'i'
                )
                const match = tag.match(pattern)
                if (!match) continue

                try {
                  const url = new URL(
                    plainText(match[1]),
                    'https://serenitypiercings.com.br/'
                  )
                  url.hash = ''
                  const asset = manifest[url.toString()]

                  if (asset) {
                    photos.push(storageUrl(asset.storage_path))
                    break
                  }
                } catch {
                  // A imagem inválida permanece na lista de pendências.
                }
              }
            })

            return Array.from(new Set(photos))
          }

          export async function getStoreProduct(slug: string) {
            if (!/^[a-zA-Z0-9_-]{1,180}$/.test(slug)) return null

            const base = await read<Row>('store_catalog', {
              select: '*', slug: `eq.${slug}`, limit: '1',
            })
            const row = base.rows[0]
            if (!row) return null

            const [media, variants, parentResult] = await Promise.all([
              readAll<Media>('product_media', '*', {
                product_id: `eq.${row.database_id}`,
              }, 'position.asc,id.asc'),
              readAll<VariantRow>('product_variants', '*', {
                product_id: `eq.${row.database_id}`,
                enabled: 'eq.true',
              }, 'position.asc,id.asc'),
              read<ParentStock>('products', {
                select: 'stock_quantity,stock_status,sold_individually',
                id: `eq.${row.database_id}`, limit: '1',
              }),
            ])

            const product = asProduct(row)
            const parent = parentResult.rows[0]
            const photos = media.filter((item) => item.media_type === 'image')
            const parentPhotos = photos.filter((item) => item.variant_id === null)

            product.images = Array.from(new Set(
              (parentPhotos.length ? parentPhotos : photos)
                .map((item) => storageUrl(item.storage_path))
                .filter(Boolean)
            ))

            if (row.product_type === 'variable') {
              const combinations: ImportedVariation[] = variants.map((variant) => {
                const prices = variantPrice(variant)
                let stock = variant.stock_quantity

                if (parent?.stock_quantity !== null &&
                    parent?.stock_quantity !== undefined) {
                  stock = stock === null
                    ? parent.stock_quantity
                    : Math.min(stock, parent.stock_quantity)
                }

                if (parent?.sold_individually) {
                  stock = stock === null ? 1 : Math.min(stock, 1)
                }

                const label = Object.entries(variant.attributes || {})
                  .filter(([, value]) => Boolean(value))
                  .map(([name, value]) => `${name} ${value}`)
                  .join(' / ')

                const photo = photos.find(
                  (item) => item.variant_id === variant.id
                )

                return {
                  id: variant.woo_id === null
                    ? variant.id : String(variant.woo_id),
                  name: label || variant.name,
                  sku: variant.sku || '',
                  ...prices,
                  stock,
                  inStock: variant.stock_status === 'instock' &&
                    parent?.stock_status !== 'outofstock' &&
                    (stock === null || stock > 0) &&
                    prices.priceAvailable,
                  image: photo ? storageUrl(photo.storage_path) : undefined,
                }
              })

              product.variations = combinations
              product.variants = [{
                type: 'variation',
                label: 'Variação',
                options: combinations.map((variation) => ({
                  id: variation.id,
                  name: variation.name,
                  value: variation.id,
                  inStock: variation.inStock,
                })),
              }]
              product.inStock = combinations.some((item) => item.inStock)
            } else if (parent?.sold_individually) {
              product.stock = product.stock === null ||
                product.stock === undefined
                ? 1 : Math.min(product.stock, 1)
            }

            product.youtubeShortId = (
              media.find((item) =>
                item.media_type === 'youtube' && item.variant_id === null
              ) || media.find((item) => item.media_type === 'youtube')
            )?.youtube_id || undefined

            const relatedPage = await getStorePage({
              category: product.categorySlug,
              perPage: 5,
            })

            const related = relatedPage.products
              .filter((item) => item.id !== product.id).slice(0, 4)

            return {
              product,
              related,
              descriptionImages: await descriptionPhotos(
                row.description || ''
              ),
              seoTitle: row.seo_title && !row.seo_title.includes('%')
                ? row.seo_title : product.name,
              seoDescription: plainText(
                row.seo_description || product.description ||
                product.longDescription
              ).slice(0, 180),
            }
          }
          """,

          "src/components/ui/ProductCard.tsx": r"""
          import Image from 'next/image'
          import Link from 'next/link'
          import { formatPrice } from '@/lib/data'
          import type { Product } from '@/lib/data'
          import clsx from 'clsx'

          interface Props {
            product: Product
            className?: string
          }

          export default function ProductCard({ product, className }: Props) {
            return (
              <Link
                href={`/produto/${product.slug}`}
                prefetch={false}
                className={clsx('group block', className)}
              >
                <div className="relative aspect-[3/4] overflow-hidden bg-[#F4F4F2] product-img-wrap">
                  {product.images[0] ? (
                    <Image
                      src={product.images[0]}
                      alt={product.name}
                      fill
                      sizes="(max-width: 640px) 50vw, (max-width: 1024px) 33vw, 25vw"
                      className="object-contain"
                    />
                  ) : (
