name: Instalar dados do destinatário

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-destinatario-checkout
  cancel-in-progress: false

jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Atualizar checkout e preparação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          files = {
          'src/lib/checkout-document.ts': r'''export function normalizeCheckoutDocument(input: unknown): string {
            if (
              typeof input !== 'string' ||
              input.length > 24 ||
              !/^[a-zA-Z0-9.\/\s-]+$/.test(input)
            ) {
              throw new Error('Informe um CPF ou CNPJ válido para a entrega.')
            }

            const document = input.replace(/[.\/\s-]/g, '').toUpperCase()

            if (/^(.)\1+$/.test(document)) {
              throw new Error('Informe um CPF ou CNPJ válido para a entrega.')
            }

            if (/^\d{11}$/.test(document)) {
              for (const length of [9, 10]) {
                let sum = 0

                for (let i = 0; i < length; i++) {
                  sum += Number(document[i]) * (length + 1 - i)
                }

                const digit = (sum * 10 % 11) % 10

                if (digit !== Number(document[length])) {
                  throw new Error('Confira os dígitos do CPF informado.')
                }
              }

              return document
            }

            if (/^[A-Z0-9]{12}\d{2}$/.test(document)) {
              for (const length of [12, 13]) {
                let sum = 0
                let weight = 2

                for (let i = length - 1; i >= 0; i--) {
                  sum += (document.charCodeAt(i) - 48) * weight
                  weight = weight === 9 ? 2 : weight + 1
                }

                const remainder = sum % 11

                if (
                  (remainder < 2 ? 0 : 11 - remainder) !==
                  Number(document[length])
                ) {
                  throw new Error('Confira os dígitos do CNPJ informado.')
                }
              }

              return document
            }

            throw new Error('Informe um CPF ou CNPJ válido para a entrega.')
          }
          ''',

          'src/components/checkout/CheckoutAddressFields.tsx': r''''use client'

          import { useEffect, useRef, useState } from 'react'
          import { CHECKOUT_STATES } from '@/lib/checkout'

          type Address = {
            street: string
            district: string
            city: string
            state: string
          }

          const empty: Address = {
            street: '',
            district: '',
            city: '',
            state: '',
          }

          const keys: (keyof Address)[] = [
            'street', 'district', 'city', 'state'
          ]

          const field = 'mt-1 min-h-[46px] w-full rounded-xl border border-[#DCD4C8] bg-white px-3 py-2 text-base sm:text-sm'

          export default function CheckoutAddressFields({
            cep,
            onCepChange,
          }: {
            cep: string
            onCepChange: (value: string) => void
          }) {
            const [address, setAddress] = useState<Address>(empty)
            const [number, setNumber] = useState('')
            const [complement, setComplement] = useState('')
            const [status, setStatus] = useState('')
            const [attempt, setAttempt] = useState(0)

            const revisions = useRef({
              street: 0,
              district: 0,
              city: 0,
              state: 0,
            })

            const postalCode = cep.replace(/\D/g, '')

            useEffect(() => {
              if (postalCode.length !== 8) {
                setStatus('')
                return
              }

              let active = true
              const controller = new AbortController()
              const initial = { ...revisions.current }
              let timeout: ReturnType<typeof setTimeout> | undefined

              setStatus('Buscando endereço…')

              const timer = setTimeout(async () => {
                timeout = setTimeout(() => controller.abort(), 8000)

                try {
                  const response = await fetch(
                    `https://viacep.com.br/ws/${postalCode}/json/`,
                    {
                      signal: controller.signal,
                      credentials: 'omit',
                      referrerPolicy: 'no-referrer',
                    }
                  )

                  if (!response.ok) throw new Error('CEP_LOOKUP')

                  const data: unknown = await response.json()

                  if (!active) return

                  if (
                    !data ||
                    typeof data !== 'object' ||
                    Array.isArray(data)
                  ) {
                    throw new Error('CEP_LOOKUP')
                  }

                  const result = data as Record<string, unknown>

                  if (result.erro) {
                    setStatus(
                      'CEP não encontrado. Confira o CEP ou preencha o endereço manualmente.'
                    )
                    return
                  }

                  if (
                    String(result.cep || '').replace(/\D/g, '') !==
                    postalCode
                  ) {
                    throw new Error('CEP_LOOKUP')
                  }

                  const text = (value: unknown, max: number) =>
                    typeof value === 'string'
                      ? value.trim().slice(0, max)
                      : ''

                  const state = text(result.uf, 2)

                  const found: Address = {
                    street: text(result.logradouro, 180),
                    district: text(result.bairro, 100),
                    city: text(result.localidade, 100),
                    state: CHECKOUT_STATES.includes(state) ? state : '',
                  }

                  setAddress(previous => {
                    const next = { ...previous }

                    for (const key of keys) {
                      if (revisions.current[key] === initial[key]) {
                        next[key] = found[key]
                      }
                    }

                    return next
                  })

                  setStatus(
                    found.street && found.district &&
                    found.city && found.state
                      ? 'Endereço encontrado. Confira os dados e informe o número.'
                      : 'CEP localizado. Complete os campos que ficaram vazios e informe o número.'
                  )
                } catch {
                  if (active) {
                    setStatus(
                      'Não foi possível buscar o CEP agora. Você pode preencher o endereço manualmente.'
                    )
                  }
                } finally {
                  if (timeout) clearTimeout(timeout)
                }
              }, 400)

              return () => {
                active = false
                clearTimeout(timer)
                if (timeout) clearTimeout(timeout)
                controller.abort()
              }
            }, [postalCode, attempt])

            function edit(key: keyof Address, value: string) {
              revisions.current[key]++
              setAddress(previous => ({ ...previous, [key]: value }))
            }

            return (
              <section className="rounded-3xl border border-[#E5DED3] bg-white p-5 sm:p-7">
                <h2 className="mb-5 text-lg font-medium">
                  Endereço para entrega
                </h2>

                <div className="grid gap-4 sm:grid-cols-2">
                  <label className="text-xs">
                    CEP
                    <input
                      name="cep"
                      value={cep}
                      onChange={event => {
                        const digits = event.target.value
                          .replace(/\D/g, '')
                          .slice(0, 8)

                        if (digits !== postalCode) {
                          for (const key of keys) revisions.current[key]++
                          setAddress({ ...empty })
                          setNumber('')
                          setComplement('')
                          setStatus('')
                        }

                        onCepChange(
                          digits.length > 5
                            ? digits.slice(0, 5) + '-' + digits.slice(5)
                            : digits
                        )
                      }}
                      required
                      maxLength={9}
                      inputMode="numeric"
                      autoComplete="postal-code"
                      aria-describedby="checkout-cep-status"
                      className={field}
                    />
                  </label>

                  <label className="text-xs">
                    Estado
                    <select
                      name="state"
                      value={address.state}
                      onChange={event => edit('state', event.target.value)}
                      required
                      autoComplete="address-level1"
                      className={field}
                    >
                      <option value="">Selecione</option>
                      {CHECKOUT_STATES.map(state => (
                        <option key={state} value={state}>{state}</option>
                      ))}
                    </select>
                  </label>

                  <div className="sm:col-span-2">
                    <p
                      id="checkout-cep-status"
                      role="status"
                      className="text-xs leading-relaxed text-[#756B5D]"
                    >
                      {status || 'Digite o CEP para buscar seu endereço.'}
                    </p>

                    {postalCode.length === 8 && (
                      <button
                        type="button"
                        onClick={() => setAttempt(value => value + 1)}
                        className="mt-2 py-1 text-xs underline"
                      >
                        Buscar endereço novamente
                      </button>
                    )}
                  </div>

                  <label className="text-xs sm:col-span-2">
                    Rua ou avenida
                    <input name="street" value={address.street}
                      onChange={event => edit('street', event.target.value)}
                      required maxLength={180} autoComplete="address-line1"
                      className={field} />
                  </label>

                  <label className="text-xs">
                    Número
                    <input name="number" value={number}
                      onChange={event => setNumber(event.target.value)}
                      required maxLength={30} className={field} />
                  </label>

                  <label className="text-xs">
                    Complemento (opcional)
                    <input name="complement" value={complement}
                      onChange={event => setComplement(event.target.value)}
                      maxLength={180} autoComplete="address-line2"
                      className={field} />
                  </label>

                  <label className="text-xs">
                    Bairro
                    <input name="district" value={address.district}
                      onChange={event => edit('district', event.target.value)}
                      required maxLength={100} className={field} />
                  </label>

                  <label className="text-xs">
                    Cidade
                    <input name="city" value={address.city}
                      onChange={event => edit('city', event.target.value)}
                      required maxLength={100} autoComplete="address-level2"
                      className={field} />
                  </label>
                </div>
              </section>
            )
          }
          ''',

          'src/app/checkout/actions.ts': r''''use server'

          import { normalizeCheckoutDocument } from '@/lib/checkout-document'
          import { revalidatePath } from 'next/cache'
          import { checkoutDatabase, checkoutError, checkoutHash } from '@/lib/checkout-server'
          import { validateCheckoutLines, validateCheckoutContact } from '@/lib/checkout'

          import type {
            CheckoutLine,
            CheckoutQuote,
            CheckoutCustomer,
            CheckoutAddress,
          } from '@/lib/checkout'

          import type { DeliveryOption, DeliveryReceipt } from '@/lib/shipping'
          import { deliveryOptions, deliveryError } from '@/lib/shipping-server'

          const uuid = (value: unknown): value is string =>
            typeof value === 'string' &&
            /^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(value)

          export async function reviewCheckout(
            input: CheckoutLine[],
            requestId?: string
          ): Promise<{ error: string; quote?: CheckoutQuote }> {
            let items: CheckoutLine[]

            try {
              items = validateCheckoutLines(input)
            } catch (error) {
              return {
                error: error instanceof Error ? error.message : 'Confira o carrinho.',
              }
            }

            try {
              const db = await checkoutDatabase('review')

              const { data, error } = await db.rpc('serenity_stock_review', {
                p_items: items,
                p_request: uuid(requestId) ? requestId : null,
              })

              if (error) throw error

              return { error: '', quote: data as CheckoutQuote }
            } catch (error) {
              return { error: checkoutError(error) }
            }
          }

          export async function quoteCheckoutShipping(
            input: {
              items: CheckoutLine[]
              requestId: string
              cep: string
            }
          ): Promise<{
            error: string
            quote?: CheckoutQuote
            options?: DeliveryOption[]
            message?: string
          }> {
            let items: CheckoutLine[]
            let cep: string

            try {
              if (
                !input ||
                !uuid(input.requestId) ||
                typeof input.cep !== 'string' ||
                !/^\d{5}-?\d{3}$/.test(input.cep.trim())
              ) {
                throw new Error(
                  'Confira o CEP de entrega e atualize a página se necessário.'
                )
              }

              items = validateCheckoutLines(input.items)
              cep = input.cep.trim().replace('-', '')
            } catch (error) {
              return {
                error: error instanceof Error
                  ? error.message
                  : 'Confira o carrinho e o CEP.',
              }
            }

            try {
              const db = await checkoutDatabase('review')

              const { data, error } = await db.rpc('serenity_stock_review', {
                p_items: items,
                p_request: input.requestId,
              })

              if (error) throw error

              const quote = data as CheckoutQuote
              const result = await deliveryOptions(
                db, items, input.requestId, cep, quote
              )

              return { error: '', quote, ...result }
            } catch (error) {
              const message = error instanceof Error ? error.message : ''

              return {
                error: deliveryError(error) || (
                  /^ME_/.test(message)
                    ? 'Não foi possível calcular a entrega agora. Confira o CEP e tente novamente ou fale com a equipe Serenity.'
                    : checkoutError(error)
                ),
              }
            }
          }

          export async function submitCheckout(input: {
            id: string
            items: CheckoutLine[]
            customer: CheckoutCustomer & { document: string }
            address: CheckoutAddress
            totalCents: number
            website: string
            shippingQuote: string
          }): Promise<{ error: string; receipt?: DeliveryReceipt }> {
            let items: CheckoutLine[]

            let contact: ReturnType<typeof validateCheckoutContact> & {
              customer: CheckoutCustomer & { document: string }
            }

            try {
              if (
                !input ||
                !uuid(input.id) ||
                !uuid(input.shippingQuote) ||
                !Number.isSafeInteger(input.totalCents) ||
                input.totalCents < 0 ||
                input.website !== ''
              ) {
                throw new Error(
                  'Confira os dados e escolha uma opção de entrega.'
                )
              }

              items = validateCheckoutLines(input.items)

              const checked = validateCheckoutContact(
                input.customer,
                input.address
              )

              contact = {
                ...checked,
                customer: {
                  ...checked.customer,
                  document: normalizeCheckoutDocument(input.customer.document),
                },
              }
            } catch (error) {
              return {
                error: error instanceof Error
                  ? error.message
                  : 'Confira os dados do pedido.',
              }
            }

            try {
              const db = await checkoutDatabase('submit')

              const fingerprint = checkoutHash(JSON.stringify({
                items,
                ...contact,
                total: input.totalCents,
                shipping: input.shippingQuote,
              }))

              const { data, error } = await db.rpc(
                'serenity_checkout_with_shipping_document',
                {
                  p_id: input.id,
                  p_fingerprint: fingerprint,
                  p_items: items,
                  p_customer: contact.customer,
                  p_address: contact.address,
                  p_expected: input.totalCents,
                  p_cart_hash: checkoutHash(JSON.stringify(items)),
                  p_shipping: input.shippingQuote,
                }
              )

              if (error) throw error

              revalidatePath('/admin/pedidos')
              revalidatePath('/admin/clientes')
              revalidatePath('/admin/produtos')
              revalidatePath('/admin/produtos/[id]', 'page')

              return { error: '', receipt: data as DeliveryReceipt }
            } catch (error) {
              return { error: deliveryError(error) || checkoutError(error) }
            }
          }

          // Serenity: documento no checkout v1
          ''',
          }

          marker = '// Serenity: documento no checkout v1'

          def read(name):
              path = root / name

              if not path.is_file():
                  raise SystemExit(
                      'Falta ' + name + '. Nenhum arquivo foi alterado.'
                  )

              return path.read_text(encoding='utf-8')

          def change(source, pattern, replacement, label):
              changed, count = re.subn(
                  pattern,
                  lambda match: replacement,
                  source,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      'O arquivo ' + label + ' mudou. '
                      'Nenhum arquivo foi alterado; envie a versão atual.'
                  )

              return changed

          name = 'src/app/checkout/CheckoutClient.tsx'
          source = read(name)

          if marker not in source:
              source = change(
                  source,
                  r"import\s*\{\s*CHECKOUT_STATES\s*\}\s*from\s*['\"]@/lib/checkout['\"]",
                  "import { normalizeCheckoutDocument } from '@/lib/checkout-document'\n"
                  "import { CHECKOUT_STATES } from '@/lib/checkout'",
                  name
              )

              source = change(
                  source,
                  r'const form\s*=\s*new FormData\(event.currentTarget\)',
                  "const form = new FormData(event.currentTarget)\n"
                  "        try { normalizeCheckoutDocument(String(form.get('document') || '')) } "
                  "catch (error) { "
                  "setMessage(error instanceof Error ? error.message : 'Confira o documento.'); "
                  "event.currentTarget.querySelector<HTMLInputElement>('[name=\"document\"]')?.focus(); "
                  "return }",
                  name
              )

              source = change(
                  source,
                  r"customer:\s*\{\s*name:\s*get\('name'\),\s*email:\s*get\('email'\),\s*phone:\s*get\('phone'\)\s*\}",
                  "customer: { name: get('name'), email: get('email'), phone: get('phone'), "
                  "document: normalizeCheckoutDocument(get('document')) }",
                  name
              )

              document_field = (
                  '<label className="text-xs sm:col-span-2">'
                  'CPF ou CNPJ do destinatário'
                  '<input name="document" required maxLength={24} '
                  'autoCapitalize="characters" spellCheck={false} '
                  'autoComplete="off" aria-describedby="document-help" '
                  'className={field} />'
                  '<span id="document-help" '
                  'className="mt-2 block text-[11px] leading-relaxed text-[#81796C]">'
                  'Informe o documento de quem receberá o pedido. '
                  'Será usado para processar a compra e preparar o envio.'
                  '</span></label>'
              )

              source = change(
                  source,
                  r'<label className="text-xs">E-mail<input',
                  document_field
                  + '\n              <label className="text-xs">E-mail<input',
                  name
              )

              files[name] = source + '\n' + marker + '\n'

          name = 'src/lib/label-draft-server.ts'
          source = read(name)

          if marker not in source:
              source = change(
                  source,
                  r"document:\s*''(?=,\s*state_register:)",
                  "document:String(customer.document||'')",
                  name
              )

              source = change(
                  source,
                  r'const fields\s*=\s*\{\s*\.\.\.defaults\s*,\s*\.\.\.textFields\(\s*draft\?\.fields\s*\)\s*\}',
                  "const fields={...defaults,...textFields(draft?.fields)}\n"
                  "  if(!fields.document.trim())fields.document=defaults.document",
                  name
              )

              files[name] = source + '\n' + marker + '\n'

          name = 'src/app/checkout/CheckoutClient.tsx'
          source = files.get(name) or read(name)
          cep_marker = '// Serenity: CEP automático v1'

          if cep_marker not in source:
              source = change(
                  source,
                  r"import\s*\{\s*CHECKOUT_STATES\s*\}\s*from\s*['\"]@/lib/checkout['\"]",
                  "import CheckoutAddressFields from '@/components/checkout/CheckoutAddressFields'",
                  name
              )

              pattern = (
                  r'<section\s+className=\{box\}>\s*'
                  r'<h2[^>]*>Endereço para entrega</h2>'
                  r'[\s\S]*?</section>'
              )

              replacement = (
                  '<CheckoutAddressFields cep={cep} onCepChange={value => { '
                  "generation.current++; setCep(value); setOptions([]); "
                  "setSelected(''); setDeliveryNote(''); setMessage('') "
                  '}} />'
              )

              source = change(source, pattern, replacement, name)
              files[name] = source + '\n' + cep_marker + '\n'

          for name, content in files.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          print('Documento e busca automática de CEP instalados.')
          PY

      - run: npm ci --ignore-scripts

      - run: npx tsc --noEmit --incremental false

      - run: npx next lint --no-cache

      - name: Salvar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/app/checkout/CheckoutClient.tsx src/app/checkout/actions.ts src/lib/checkout-document.ts src/lib/label-draft-server.ts src/components/checkout/CheckoutAddressFields.tsx

          if git diff --cached --quiet; then
            echo "Dados do destinatário já instalados."
          else
            git commit -m "Adicionar documento e busca automática de endereço no checkout"
            git push origin HEAD:main
          fi
